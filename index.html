const LD_SEGMENTS = [
  { key:'snack',      label:'随机零食', weight:50, color:'#ff6b6b', icon:'🍿', desc:'从零食盒里随机抽一样，运气好抽到大份的！' },
  { key:'stationery', label:'随机文具', weight:30, color:'#4ecdc4', icon:'✏️', desc:'随机领取一件文具，笔、本子、橡皮都有可能。' },
  { key:'milktea',    label:'奖励奶茶', weight:10, color:'#ffe66d', icon:'🧋', desc:'请你喝一杯奶茶！' },
  { key:'noPunish',   label:'免罚券',   weight:2,  color:'#95e1d3', icon:'🛡️', desc:'可抵扣一次课堂小惩罚。' },
  { key:'noHomework', label:'免作业券', weight:2,  color:'#f38181', icon:'📝', desc:'可免除一次家庭作业。' },
  { key:'leavePass',  label:'请假券',   weight:2,  color:'#aa96da', icon:'🎫', desc:'可请假一次且不扣积分。' },
  { key:'praise',     label:'表扬券',   weight:2,  color:'#fcbad3', icon:'⭐', desc:'课堂公开表扬一次，并通知家长。' },
  { key:'universal',  label:'万能券',   weight:2,  color:'#c9b1ff', icon:'🌟', desc:'四种券任选一张！' },
];

const TABS = [
  { key:'roster',    label:'日常反馈表',   icon:'📋' },
  { key:'attend',    label:'出勤统计',   icon:'🗓️' },
  { key:'trend',     label:'测试分析',   icon:'📈' },
  { key:'checkin',   label:'打卡登记',   icon:'✅' },
  { key:'profile',   label:'学生档案',   icon:'👤' },
  { key:'exam',      label:'考试成绩',   icon:'🎓' },
  { key:'files',     label:'资料库',     icon:'🗂️' },
  { key:'weekly',    label:'周测月考',   icon:'📆' },
  { key:'summary',   label:'成绩汇总',   icon:'🗂️' },
  { key:'export',    label:'导出报告',   icon:'📤' },
];

/* ==================================================================
   二、默认数据（可自定义：班级 / 学生名单 / 颜色）
   ================================================================== */
/* 班级配色池：新建班级时按顺序自动分配，也可在班级设置里手动改 */
const CLASS_COLORS = ['#3b6fe0','#e0693b','#16a34a','#d946a0','#2563eb','#0891b2','#ca8a04','#dc2626'];

function uid(){ return Date.now() * 1000 + Math.floor(Math.random() * 1000); }
function makeStudents(names){
  return names.map(n => ({ id: uid(), name: n, records: {}, mistakes: [], spentPoints:0, manualPts:0, ptsLog:[] }));
}
/* 出厂即空：班级与学生全部由界面自主添加 */
function buildDefaultData(){
  return {
    classes: [],
    activeClassId: 0,
    activeDate: todayStr(),
    activeTab: 'roster',
    todos: [],
    mistakeStudentId: null,
    trendStudentId: null,
    gradeLines: [],
    examPapers: [],
    weeklyExams: { students: [], records: [] },
    ldHistory: [],
    behaviorOpts: null, absorptionOpts: null, lottery: null, points: null, tabOrder: null,
    teacherName: null, profileOptions: null,
  };
}
/* ==================================================================
   三、全局状态 + 存储
   ================================================================== */
let state = {
  classes: [], activeClassId: 1, activeDate: todayStr(), activeTab: 'roster',
  todos: [], mistakeStudentId: null, trendStudentId: null,
  gradeLines: [], examPapers: [],
  weeklyExams: { students: [], records: [] },
  ldHistory: [],
  behaviorOpts: null, absorptionOpts: null, lottery: null, points: null, tabOrder: null,
  teacherName: null, profileOptions: null,
};

/* 临时 UI 状态（不持久化） */
const ui = {
  rankFrom: '', rankTo: '', rankTypes: ['quiz','homework'], rankPeriod: EXAM_PERIODS[0],
  weeklyFilterClass: '', weeklySearch: '', weeklyFilterSchool: '', weeklyFrom: '', weeklyTo: '',
  glSearch: '', paperSearch: '',
  ldStudentKey: '', ldMood: 'good', ldRotation: 0, ldSpinning: false, ldEmbed: false,
  psStudentKey: '', psOp: 'add', psAmt: 1,
  attFrom: '', attTo: '', attRangeInit: false, attStudentId: '', attScope: 'cur',
  trendMode: 'student', trendType: 'all', trendSchool: '',
  ckMonth: '',   // 打卡登记当前查看的月份（YYYY-MM），空则跟随当前日期
};

function todayStr(d){
  const x = d ? new Date(d) : new Date();
  const p = n => String(n).padStart(2, '0');
  return x.getFullYear() + '-' + p(x.getMonth() + 1) + '-' + p(x.getDate());
}
function shiftDate(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return todayStr(d);
}
function fmtDateCN(dateStr){
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][new Date(dateStr + 'T00:00:00').getDay()];
  return `${+m}月${+d}日 ${wd}`;
}
function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(v){
  if (v === '' || v === null || v === undefined) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
function fmt1(n){ return (Math.round(n * 10) / 10).toFixed(1); }
function scoreClass(v){ if (v === null) return ''; return v >= 8 ? 's-g' : v >= 6 ? 's-y' : 's-r'; }
/* 进门小测着色：按「满分 quizScale」换算百分比，与等级线阈值一致（≥良 绿 / ≥中 黄 / 其余 红） */
function quizRatio(v){ const s = state.quizScale || 100; return (v === null || v === undefined) ? null : v / s; }
function quizScoreClass(v){
  const r = quizRatio(v); if (r === null) return '';
  const t = state.quizThresholds || { excellent:90, good:70, pass:60 }, s = state.quizScale || 100;
  return r >= t.good / s ? 's-g' : r >= t.pass / s ? 's-y' : 's-r';
}
/* 取作业有效分值：分数模式直接取 r.homework；完成模式将 hwDone 转为满分/0 */
function hwEffective(r){
  if (state.hwMode === 'done') {
    if (r.hwDone === true) { const P = (state.points || defaultPoints()).roster; return P.hwFull; }
    if (r.hwDone === false) return 0;
    return null; // 未标记 → 无数据
  }
  return num(r.homework);
}
function valClass(v){ if (v === null) return ''; return v >= 8 ? 'v-g' : v >= 6 ? 'v-y' : 'v-r'; }
function bigValClass(v){ if (v === null) return ''; return v >= 90 ? 'v-g' : v >= 70 ? 'v-y' : 'v-r'; }
function optOf(list, key){ return list.find(o => o.key === key); }
function bytes(n){
  if (!n && n !== 0) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function activeClass(){
  return state.classes.find(c => c.id === state.activeClassId) || state.classes[0];
}
function allStudents(){
  const out = [];
  state.classes.forEach(c => c.students.forEach(s => out.push({ s, c })));
  return out;
}
function findStudentByKey(key){
  const [cid, sid] = String(key).split(':');
  const c = state.classes.find(x => String(x.id) === cid);
  if (!c) return null;
  const s = c.students.find(x => String(x.id) === sid);
  return s ? { s, c } : null;
}
function rec(student, date){
  student.records = student.records || {};
  if (!student.records[date]) {
    student.records[date] = { attendance:'present', quiz:'', homework:'', hwRating:'', behavior:[], absorption:[] };
  }
  const r = student.records[date];
  if (!Array.isArray(r.behavior)) r.behavior = [];
  if (!Array.isArray(r.absorption)) r.absorption = [];
  return r;
}
function recRaw(student, date){ return (student.records || {})[date] || null; }

/* -------- 保存 -------- */
let saveTimer = null;
function updateSaveStatus(kind){
  const el = document.getElementById('saveStatus');
  if (!el) return;
  const map = { loading:'☁️ 加载中', saving:'💾 保存中', saved:'✅ 已保存', synced:'☁️ 数据已同步' };
  el.textContent = map[kind] || map.synced;
}
function saveNow(silent){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    updateSaveStatus('saved');
    setTimeout(() => updateSaveStatus('synced'), 1600);
    if (!silent) toast('已保存 ✅');
  } catch (e) {
    toast('保存失败：存储空间可能已满');
    console.error(e);
  }
}
function save(){
  updateSaveStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    syncWeeklyExamStudents(); // 绑定学生档案：任何改动后周测月考自动同步 姓名/班级/学校
    saveNow(true);
  }, 500);
}
function loadFromStorage(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.classes)) return false;
    state = Object.assign(state, data);
    normalizeState();
    return true;
  } catch (e) { console.error(e); return false; }
}
function normalizeState(){
  state.classes = state.classes || [];
  state.classes.forEach(c => {
    c.students = c.students || [];
    c.lessons = c.lessons || {};
    c.profiles = c.profiles || {};
    c.examScores = c.examScores || {};
    c.extraPractice = c.extraPractice || {};   // 加练名单（手动加入）：{ [date]: { [sid]: 目标文本 } }
    c.extraPracticeEx = c.extraPracticeEx || {}; // 加练名单排除表（规则命中但老师手动移出）：{ [date]: { [sid]: true } }
  c.checkins = c.checkins || {};             // 打卡登记：{ [date]: { [sid]: { st:'done'|'makeup', at, m, n, f } } }
  c.checkinOff = c.checkinOff || {};         // 每日打卡：免打卡日（休息日，独立于日常反馈）：{ [date]: true }
  c.attendanceOff = c.attendanceOff || {};   // 日常反馈：休息日（不做考勤要求、不计入积分等统计）：{ [date]: true }
  c.checkinDocs = c.checkinDocs || {};       // 当日打卡内容（班级级）：{ [date]: [ {id,title,fileKey,fileName,size,type,date} ] }
  c.attendanceDocs = c.attendanceDocs || [];  // 纸质出勤登记表附件（班级级）：[ {id,title,date,fileKey,fileName,size,type} ]
  /* 一次性迁移：原先「考勤要求」与「每日打卡」共用 checkinOff，现拆分为两个独立字段。
     把旧 checkinOff 数据归属到日常反馈的 attendanceOff，并清空 checkinOff（打卡由用户单独设置）。 */
  if (!state._attOffMigrated && c.checkinOff && Object.keys(c.checkinOff).length) {
    Object.assign(c.attendanceOff, c.checkinOff);
    c.checkinOff = {};
  }
    if (!c.checkinStart) c.checkinStart = todayStr(); // 打卡开始日期，早于此日期不计入统计
    c.students.forEach(s => {
      s.records = s.records || {};
      s.mistakes = s.mistakes || [];
      s.spentPoints = s.spentPoints || 0;
      s.manualPts = s.manualPts || 0;
      s.ptsLog = s.ptsLog || [];
    });
  });
  /* 学生档案：独立于班级的全局数据源（sid -> {id,name,school,class,remark,custom}）。
     班级新增学生自动进入档案；从班级删除学生，档案保留不变；档案仅可由管理员在「学生档案」页删除。 */
  state.studentProfiles = state.studentProfiles || {};
  state.classes.forEach(c => c.students.forEach(s => {
    const id = String(s.id);
    const gp = state.studentProfiles[id] || (state.studentProfiles[id] = { id: s.id, name: s.name, school:'', class:'', remark:'', custom:[] });
    if (!gp.name) gp.name = s.name;
    if (!Array.isArray(gp.custom)) gp.custom = [];
    const cp = (c.profiles && c.profiles[s.id]) || {};
    ['school','class','remark'].forEach(k => { if (!gp[k] && cp[k]) gp[k] = cp[k]; });
    if (!gp.custom.length && Array.isArray(cp.custom)) gp.custom = cp.custom;
  }));
  state.todos = state.todos || [];
  state.gradeLines = state.gradeLines || [];
  state.examPapers = state.examPapers || [];
  state.weeklyExams = state.weeklyExams || { students: [], records: [] };
  state.weeklyExams.students = state.weeklyExams.students || [];
  state.weeklyExams.records = state.weeklyExams.records || [];
  state.ldHistory = state.ldHistory || [];
  if (!state.activeDate) state.activeDate = todayStr();
  if (!state.activeTab) state.activeTab = 'roster';
  /* 可自定义配置：首次或旧数据缺省时，用出厂默认值补齐 */
  if (!Array.isArray(state.behaviorOpts) || !state.behaviorOpts.length)
    state.behaviorOpts = BEHAVIOR_OPTS.map(o => ({ ...o }));
  if (!Array.isArray(state.absorptionOpts) || !state.absorptionOpts.length)
    state.absorptionOpts = ABSORPTION_OPTS.map(o => ({ ...o }));
  if (!state.lottery || !Array.isArray(state.lottery.segments) || !state.lottery.segments.length)
    state.lottery = { cost: LD_COST, segments: LD_SEGMENTS.map(o => ({ ...o })) };
  if (!state.points) state.points = defaultPoints();
  /* 旧版积分规则为扁平结构（att/quizFull/...），迁移到模块化结构 */
  if (!state.points.version || state.points.version < 2) {
    const old = state.points || {};
    state.points = {
      version: 2,
      roster: {
        att: old.att && typeof old.att === 'object' ? old.att : { present: 1, late: 1, leave: 0 },
        quizFull: num(old.quizFull) != null ? old.quizFull : 100,
        quizFullBonus: num(old.quizBonus) != null ? old.quizBonus : 2,
        quizHigh: 90, quizHighBonus: 1,
        hwFull: num(old.hwFull) != null ? old.hwFull : 10,
        hwFullBonus: num(old.hwBonus) != null ? old.hwBonus : 2,
        bothBonus: num(old.bothBonus) != null ? old.bothBonus : 2,
        behaviorPerTag: 0, absorptionPerTag: 0,
        cap: num(old.cap) != null ? old.cap : 7,
      },
      checkin: { done: 1, makeup: 0.5, mastery: { full: 1, partial: 0.5, none: 0 } },
      exam: { mathFull: 120, mathFullBonus: 5, mathHigh: 100, mathHighBonus: 3, totalHigh: 500, totalHighBonus: 3, improve: 15, improveBonus: 2, cap: 10 },
      weekly: { full: 100, fullBonus: 3, high: 85, highBonus: 2, cap: 5 },
    };
  }
  if (!Array.isArray(state.tabOrder) || !state.tabOrder.length)
    state.tabOrder = TABS.map(t => t.key);
  /* 「错题库」已升级为「打卡登记」：迁移旧的 Tab 顺序与当前选中项 */
  const _mi = state.tabOrder.indexOf('mistake');
  if (_mi >= 0) state.tabOrder[_mi] = 'checkin';
  if (state.activeTab === 'mistake') state.activeTab = 'checkin';
  /* 「等级线记录」与「试卷记录」已合并为「资料库」：迁移旧 Tab 顺序与当前选中项 */
  ['gradeline','paper'].forEach(old => {
    const idx = state.tabOrder.indexOf(old);
    if (idx >= 0) state.tabOrder[idx] = 'files';
  });
  if (state.activeTab === 'gradeline' || state.activeTab === 'paper') state.activeTab = 'files';
  /* Tab 顺序自愈：补齐新增功能区、剔除已下线功能区 */
  const _valid = TABS.map(t => t.key);
  state.tabOrder = state.tabOrder.filter((k, i) => _valid.includes(k) && state.tabOrder.indexOf(k) === i);
  _valid.forEach(k => { if (!state.tabOrder.includes(k)) state.tabOrder.push(k); });
  /* 加练规则：教师可自定义纳入加练名单的条件 */
  const _epd = defaultEpRules();
  state.epRules = Object.assign(_epd, state.epRules || {});
  ['quiz','homework','behavior','absorption'].forEach(k => {
    state.epRules[k] = Object.assign(defaultEpRules()[k], state.epRules[k] || {});
  });
  /* 家庭作业输入模式：'score'=分数模式（默认）, 'done'=完成模式（✓完成/✕未完成） */
  if (!state.hwMode) state.hwMode = 'score';
  if (!state.labels || typeof state.labels !== 'object') state.labels = {};
  if (!state.labels.quiz) state.labels.quiz = '小测';
  if (!state.labels.homework) state.labels.homework = '家庭作业';
  /* 进门小测等级阈值（100 分制）：优 ≥ excellent，良 ≥ good，中 ≥ pass，其余为差 */
  if (!state.quizThresholds || typeof state.quizThresholds !== 'object')
    state.quizThresholds = { excellent:90, good:70, pass:60 };
  /* 小测满分（录入 / 着色 / 等级线都按此换算）：默认 100，可改为 10 / 120 等 */
  if (!state.quizScale || isNaN(+state.quizScale) || +state.quizScale <= 0) state.quizScale = 100;
  /* 兼容旧数据：旧版按 10 分制（阈值 ≤10），自动×10 折算为 100 分制 */
  else if ((state.quizThresholds.excellent|0) <= 10 && (state.quizThresholds.good|0) <= 10 && (state.quizThresholds.pass|0) <= 10) {
    state.quizThresholds = {
      excellent: state.quizThresholds.excellent * 10,
      good:      state.quizThresholds.good      * 10,
      pass:      state.quizThresholds.pass      * 10,
    };
  }
  /* 测试分析：达标分改为 100 分制；旧 10 分制自动×10（8→80 等） */
  if (state.trendPass == null || isNaN(+state.trendPass)) state.trendPass = 60;
  else if (+state.trendPass <= 10) state.trendPass = +state.trendPass * 10;
  if (!state.trendScope) state.trendScope = 'both';
  /* 工作台名称：首次或旧数据缺省时用出厂值 */
  if (!state.teacherName || typeof state.teacherName !== 'string' || !state.teacherName.trim())
    state.teacherName = TEACHER_NAME;
  /* 档案下拉选项：出厂默认值 + 合并已有的档案取值，保证老数据仍可被选回 */
  if (!state.profileOptions || typeof state.profileOptions !== 'object')
    state.profileOptions = {};
  const PO_DEFAULT = {
    school: ['实验初级中学', '第一中学', '第二中学', '第三中学'],
    class: ['1班', '2班', '3班', '4班'],
  };
  ['school', 'class'].forEach(k => {
    const set = new Set(PO_DEFAULT[k]);
    state.classes.forEach(c => (c.students || []).forEach(s => {
      const v = (profileOf(s.id) || {})[k] || '';
      if (v) set.add(v);
    }));
    state.profileOptions[k] = [...set];
  });
  migrateBlankDate();
  /* 标记「考勤要求」与「每日打卡」字段拆分迁移完成（仅执行一次） */
  state._attOffMigrated = true;
  if (!state.classes.some(c => c.id === state.activeClassId) && state.classes[0]) {
    state.activeClassId = state.classes[0].id;
  }
}
/* 早期版本 activeDate 可能为空，导致记录被写进 '' 这个空日期键。
   这里把空键内容迁移到今天，避免数据看起来「凭空消失」。*/
function migrateBlankDate(){
  const today = state.activeDate || todayStr();
  const hasContent = o => o && Object.keys(o).some(k => {
    const v = o[k];
    return Array.isArray(v) ? v.length : (v !== '' && v != null && v !== 'present');
  });
  state.classes.forEach(c => {
    (c.students || []).forEach(s => {
      const r = s.records && s.records[''];
      if (r === undefined) return;
      if (hasContent(r) && !s.records[today]) s.records[today] = r;
      delete s.records[''];
      if (s.makeups && s.makeups['']) { delete s.makeups['']; }
    });
    const l = c.lessons && c.lessons[''];
    if (l !== undefined) {
      if (hasContent(l) && !c.lessons[today]) c.lessons[today] = l;
      delete c.lessons[''];
    }
  });
}

function hasRealData(s){
  if (!s || !Array.isArray(s.classes) || !s.classes.length) return false;
  for (const c of s.classes) {
    // 手动建的班级本身就是真实数据，哪怕还没录成绩，也不能被默认数据覆盖
    if ((c.students || []).length) return true;
    for (const st of (c.students || [])) {
      if (st.records && Object.keys(st.records).length) return true;
      if (st.mistakes && st.mistakes.length) return true;
    }
    if (c.lessons && Object.keys(c.lessons).length) return true;
    if (c.profiles && Object.keys(c.profiles).length) return true;
    if (c.examScores && Object.keys(c.examScores).length) return true;
    if (c.checkins && Object.keys(c.checkins).length) return true;
    if (c.extraPractice && Object.keys(c.extraPractice).length) return true;
  }
  if ((s.gradeLines || []).length) return true;
  if ((s.examPapers || []).length) return true;
  if (((s.weeklyExams || {}).records || []).length) return true;
  if ((s.todos || []).length) return true;
  return false;
}

/* -------- IndexedDB 文件存储 -------- */
let _db = null;
function openDB(){
  return new Promise((resolve, reject) => {
    if (_db) return resolve(_db);
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e);
  });
}
function dbPut(key, blob){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(blob, key);
    tx.oncomplete = () => res(true);
    tx.onerror = e => rej(e);
  }));
}
function dbGet(key){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const r = tx.objectStore(DB_STORE).get(key);
    r.onsuccess = () => res(r.result || null);
    r.onerror = e => rej(e);
  }));
}
function dbDelete(key){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res(true);
    tx.onerror = e => rej(e);
  }));
}
const _urlCache = {};
async function getFileUrl(key){
  if (_urlCache[key]) return _urlCache[key];
  const blob = await dbGet(key);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  _urlCache[key] = url;
  return url;
}

/* -------- 积分计算 -------- */
/* 默认积分规则（教师可在「积分规则」面板按模块自行修改）
   结构：state.points = { version, roster, checkin, exam, weekly }
   - roster  日常反馈表（按日记录：出勤/小测/作业/课堂表现/吸收）
   - checkin 打卡登记（按日：完成打卡/补卡 + 知识点掌握度）
   - exam    考试成绩（按期：数学满分/高分、总分高分、进步）
   - weekly  周测月考（按次：满分/高分）
   所有积分均由数据自动累计，无需手动逐条加；规则改后历史积分即时重算。 */
function defaultPoints(){
  return {
    version: 2,
    roster: {
      att: { present: 1, late: 1, leave: 0 }, // 出勤基础分
      quizFull: 100, quizFullBonus: 2,         // 小测满分(100)额外奖励
      quizHigh: 90,  quizHighBonus: 1,         // 小测高分(≥90)额外奖励
      hwFull: 10,   hwFullBonus: 2,            // 作业满分额外奖励（完成模式✓等同满分）
      bothBonus: 2,                            // 小测与作业同日均满分加成
      behaviorPerTag: 0,                       // 课堂表现每标签积分（默认 0）
      absorptionPerTag: 0,                     // 课堂吸收每标签积分（默认 0）
      cap: 7,                                 // 单日积分上限
    },
    checkin: {
      done: 1, makeup: 0.5,                   // 完成打卡 / 补卡
      mastery: { full: 1, partial: 0.5, none: 0 }, // 知识点掌握 / 部分掌握 / 未掌握
    },
    exam: {
      mathFull: 120, mathFullBonus: 5,        // 数学满分(120)奖励
      mathHigh: 100, mathHighBonus: 3,        // 数学高分(≥100)奖励
      totalHigh: 500, totalHighBonus: 3,      // 总分高分(≥500)奖励
      improve: 15, improveBonus: 2,           // 数学较上期进步≥15 奖励
      cap: 10,                                // 单期积分上限
    },
    weekly: {
      full: 100, fullBonus: 3,                // 周测/月考满分(100)奖励
      high: 85,  highBonus: 2,                // 高分(≥85)奖励
      cap: 5,                                // 单次积分上限
    },
  };
}
/* 可自定义配置的访问器：优先用教师修改后的 state 配置，缺省时退回出厂常量 */
function BOPTS(){ return (state.behaviorOpts && state.behaviorOpts.length) ? state.behaviorOpts : BEHAVIOR_OPTS; }
function AOPTS(){ return (state.absorptionOpts && state.absorptionOpts.length) ? state.absorptionOpts : ABSORPTION_OPTS; }
function LSEG(){ return (state.lottery && state.lottery.segments && state.lottery.segments.length) ? state.lottery.segments : LD_SEGMENTS; }
function LCOST(){ return (state.lottery && state.lottery.cost != null) ? state.lottery.cost : LD_COST; }
/* 列名标签（可在「日常反馈表」表头点击修改） */
function LBL(k){ return (state.labels && state.labels[k]) ? state.labels[k] : (k === 'quiz' ? '小测' : '家庭作业'); }
function setLabel(k, v){
  state.labels = state.labels || {};
  state.labels[k] = (v || '').trim() || (k === 'quiz' ? '小测' : '家庭作业');
  save(); renderMain();
}
function dayPoints(r){
  if (!r) return 0;
  const P = (state.points || defaultPoints()).roster;
  if (r.attendance === 'leave') return 0;
  let p = r.attendance === 'present' ? P.att.present : r.attendance === 'late' ? P.att.late : 0;
  const q = num(r.quiz), h = hwEffective(r);
  if (q !== null && q === P.quizFull) p += P.quizFullBonus;
  else if (q !== null && q >= P.quizHigh) p += P.quizHighBonus;
  if (h !== null && h === P.hwFull) p += P.hwFullBonus;
  if (q !== null && q === P.quizFull && h !== null && h === P.hwFull) p += P.bothBonus;
  (r.behavior || []).forEach(() => { p += P.behaviorPerTag; });
  (r.absorption || []).forEach(() => { p += P.absorptionPerTag; });
  return Math.max(0, Math.min(p, P.cap));
}
/* 该学生所属班级的「日常反馈休息日」集合（attendanceOff）。休日不做考勤要求、不计入积分等统计。 */
function studentRestDays(student){
  if (!student) return new Set();
  const id = String(student.id);
  const set = new Set();
  (state.classes || []).forEach(c => {
    if ((c.students || []).some(s => String(s.id) === id))
      Object.keys(c.attendanceOff || {}).forEach(d => set.add(d));
  });
  return set;
}
/* 指定日期是否对该学生而言是「日常反馈休息日」 */
function isFeedbackRest(student, date){ return studentRestDays(student).has(date); }
/* 模块一：日常反馈表（按日记录累加，休息日不计分） */
function rosterPoints(student){
  let sum = 0;
  const rest = studentRestDays(student);
  Object.entries(student.records || {}).forEach(([date, r]) => { if (!rest.has(date)) sum += dayPoints(r); });
  return Math.round(sum * 10) / 10;
}
/* 取该学生所属的所有班级（避免跨班重复计算） */
function studentClasses(student){
  const id = String(student.id);
  return state.classes.filter(c => (c.students || []).some(s => String(s.id) === id));
}
/* 模块二：打卡登记（完成/补卡 + 知识点掌握度） */
function checkinPoints(student){
  const P = (state.points || defaultPoints()).checkin;
  let sum = 0;
  studentClasses(student).forEach(c => {
    const cm = c.checkins || {};
    Object.keys(cm).forEach(date => {
      const rec = cm[date][String(student.id)];
      if (!rec) return;
      if (rec.st === 'done') sum += P.done;
      else if (rec.st === 'makeup') sum += P.makeup;
      if (rec.m === 'full') sum += P.mastery.full;
      else if (rec.m === 'partial') sum += P.mastery.partial;
    });
  });
  return Math.round(sum * 10) / 10;
}
/* 模块三：考试成绩（按期：数学满分/高分、总分高分、进步） */
function examPoints(student){
  const P = (state.points || defaultPoints()).exam;
  let sum = 0;
  studentClasses(student).forEach(c => {
    const per = (c.examScores || {})[String(student.id)];
    if (!per) return;
    const periods = EXAM_PERIODS.filter(p => per[p] && num(per[p].mathScore) !== null);
    periods.forEach((p, idx) => {
      let pp = 0;
      const m = num(per[p].mathScore), t = num(per[p].totalScore);
      if (m !== null && m === P.mathFull) pp += P.mathFullBonus;
      else if (m !== null && m >= P.mathHigh) pp += P.mathHighBonus;
      if (t !== null && t >= P.totalHigh) pp += P.totalHighBonus;
      if (idx > 0) {
        const pm = num(per[periods[idx - 1]].mathScore);
        if (pm !== null && m !== null && (m - pm) >= P.improve) pp += P.improveBonus;
      }
      sum += Math.min(pp, P.cap);
    });
  });
  return Math.round(sum * 10) / 10;
}
/* 模块四：周测月考（按次：满分/高分） */
function weeklyPoints(student){
  const P = (state.points || defaultPoints()).weekly;
  let sum = 0;
  (state.weeklyExams.records || []).forEach(r => {
    if (String(r.studentId) !== String(student.id)) return;
    const v = num(r.score); if (v === null) return;
    let pp = 0;
    if (v === P.full) pp += P.fullBonus;
    else if (v >= P.high) pp += P.highBonus;
    sum += Math.min(pp, P.cap);
  });
  return Math.round(sum * 10) / 10;
}
/* 学生各模块积分汇总 */
function studentModulePoints(student){
  return {
    roster: rosterPoints(student),
    checkin: checkinPoints(student),
    exam: examPoints(student),
    weekly: weeklyPoints(student),
  };
}
function calcTotalPoints(student){
  const m = studentModulePoints(student);
  return Math.round((m.roster + m.checkin + m.exam + m.weekly) * 10) / 10;
}
function availablePoints(student){
  return calcTotalPoints(student) - (student.spentPoints || 0) + (student.manualPts || 0);
}
/* 积分来源明细（按模块），供统计面板展示 */
function pointsBreakdown(student){
  const m = studentModulePoints(student);
  let manualAdd = 0, manualSub = 0;
  (student.ptsLog || []).forEach(l => {
    if (l.source === 'manual') { if (l.amount > 0) manualAdd += l.amount; else manualSub += -l.amount; }
  });
  return {
    roster: m.roster, checkin: m.checkin, exam: m.exam, weekly: m.weekly,
    manualAdd, manualSub, spent: student.spentPoints || 0,
  };
}

/* -------- 周测月考学生同步（只增不删） -------- */
function syncWeeklyExamStudents(){
  const we = state.weeklyExams;
  // 班级新增学生自动进入「学生档案」（全局、独立于班级），并同步姓名
  state.classes.forEach(c => c.students.forEach(s => ensureProfile(s.id, s.name)));
  // 收集当前所有班级里真实存在的学生 id
  const valid = new Set();
  state.classes.forEach(c => c.students.forEach(s => valid.add(String(s.id))));
  // 移除已退班（不在任何班级）的同步名单，避免下拉里出现已删除的学生
  if (we.students.length) we.students = we.students.filter(s => valid.has(String(s.id)));
  const exist = new Set(we.students.map(s => String(s.id)));
  state.classes.forEach(c => c.students.forEach(s => {
    const school = (profileOf(s.id) || {}).school || '';
    if (!exist.has(String(s.id))) {
      we.students.push({ id: s.id, name: s.name, className: c.name, school });
      exist.add(String(s.id));
    } else {
      const t = we.students.find(x => String(x.id) === String(s.id));
      if (t) { t.name = s.name; t.className = c.name; t.school = school; }
    }
  }));
  syncWeeklyRecordProfiles();
}
/* 将周测月考记录与家长/学生档案绑定：按 studentId 实时回填 姓名/班级/学校。
   在「学生档案」中改名、改学校或调班级后，历史成绩自动同步，避免数据错位。
   未匹配到班级学生的记录（如按姓名直接录入）保留原值。 */
function syncWeeklyRecordProfiles(){
  const we = state.weeklyExams;
  if (!we || !Array.isArray(we.records)) return;
  const map = {};
  state.classes.forEach(c => (c.students || []).forEach(s => {
    const school = (profileOf(s.id) || {}).school || '';
    map[String(s.id)] = { name: s.name, className: c.name, school };
  }));
  we.records.forEach(r => {
    if (!r.studentId) return;
    const info = map[String(r.studentId)];
    if (info) { r.name = info.name; r.className = info.className; r.school = info.school; }
  });
}
/* 列举所有出现过的学校（含 profileOptions 默认值 + 各班级档案里已填值） */
function allSchools(){
  const set = new Set();
  (state.profileOptions && state.profileOptions.school || []).forEach(v => v && set.add(v));
  state.classes.forEach(c => c.students.forEach(s => {
    const sc = (profileOf(s.id) || {}).school;
    if (sc) set.add(sc);
  }));
  (state.weeklyExams.records || []).forEach(r => { if (r.school) set.add(r.school); });
  return [...set].filter(Boolean).sort();
}
/* 跨班级按学校取学生 */
function studentsBySchool(school){
  const out = [];
  state.classes.forEach(c => c.students.forEach(s => {
    const sc = (profileOf(s.id) || {}).school;
    if (sc === school) out.push({ id: s.id, name: s.name, className: c.name, school });
  }));
  return out;
}
/* 按姓名在全部班级里查找学生（同名校取第一个） */
function findStudentByName(name){
  const n = (name || '').trim();
  if (!n) return null;
  for (const c of state.classes) {
    const s = c.students.find(x => x.name === n);
    if (s) {
      const school = (profileOf(s.id) || {}).school || '';
      return { id: s.id, name: s.name, className: c.name, school };
    }
  }
  return null;
}
/* 清理已退班学生的历史成绩记录（仅手动触发，避免误删） */
function cleanupWeeklyOrphans(){
  if (!confirm('将删除「周测月考」中所有已不在任何班级的学生记录，确定继续？')) return;
  const valid = new Set();
  state.classes.forEach(c => c.students.forEach(s => valid.add(String(s.id))));
  const before = state.weeklyExams.records.length;
  state.weeklyExams.records = state.weeklyExams.records
    .filter(r => !r.studentId || valid.has(String(r.studentId)));
  syncWeeklyExamStudents();
  save(); renderMain();
  toast(`已清理 ${before - state.weeklyExams.records.length} 条退班学生记录`);
}
/* ==================================================================
   四、侧边栏 / 顶栏 / Tab 渲染
   ================================================================== */
function renderSidebar(){
  const doneCount = state.todos.filter(t => t.done).length;
  const html = `

/* ==================================================================
   Tab 1：日常反馈表 (roster)
   ================================================================== */
function rankedRows(cls, d){
  const arr = cls.students.map(s => {
    const r = rec(s, d);
    return { s, r, leave: r.attendance === 'leave', q: num(r.quiz), h: hwEffective(r) };
  });
  arr.sort((a, b) => {
    if (a.leave !== b.leave) return a.leave ? 1 : -1;
    const aHas = a.q !== null || a.h !== null, bHas = b.q !== null || b.h !== null;
    if (aHas !== bHas) return aHas ? -1 : 1;
    const aq = a.q === null ? -1 : a.q, bq = b.q === null ? -1 : b.q;
    if (bq !== aq) return bq - aq;
    const ah = a.h === null ? -1 : a.h, bh = b.h === null ? -1 : b.h;
    return bh - ah;
  });
  return arr;
}
function rankReady(cls, d){
  const act = cls.students.filter(s => rec(s, d).attendance !== 'leave');
  if (!act.length) return false;
  return act.every(s => { const r = rec(s, d); return num(r.quiz) !== null && hwEffective(r) !== null; });
}
function statsOf(cls, d, field){
  const vals = cls.students
    .filter(s => rec(s, d).attendance !== 'leave')
    .map(s => field === 'homework' ? hwEffective(rec(s, d)) : num(rec(s, d)[field]))
    .filter(v => v !== null);
  if (!vals.length) return null;
  return { avg: vals.reduce((a, b) => a + b, 0) / vals.length, max: Math.max(...vals), min: Math.min(...vals), n: vals.length };
}

/* -------- 加练名单（日常反馈表：规则自定义 + 按日期手动增删） --------
   名单 = 手动加入 ∪ 规则命中（开启「自动纳入」且未被手动移出）
   规则支持：小测低于 N 分 / 作业低于 N 分 / 课堂表现命中项 / 吸收情况命中项 */
function defaultEpRules(){
  return {
    auto: true,                        // 命中规则的学生自动进入当日名单
    skipLeave: true,                   // 当天请假的学生不纳入
    quiz:       { on:true,  lt:8 },    // 小测低于 lt 分
    homework:   { on:false, lt:8 },    // 家庭作业低于 lt 分
    behavior:   { on:false, keys:[] }, // 课堂表现命中任一项
    absorption: { on:false, keys:[] }, // 课堂吸收命中任一项
  };
}
function EPR(){ return state.epRules || defaultEpRules(); }
function epRuleSummary(){
  const R = EPR(); const p = [];
  if (R.quiz.on)       p.push(`小测&lt;${R.quiz.lt}分`);
  if (R.homework.on)   p.push(`作业&lt;${R.homework.lt}分`);
  if (R.behavior.on   && R.behavior.keys.length)   p.push(`课堂表现 ${R.behavior.keys.length} 项`);
  if (R.absorption.on && R.absorption.keys.length) p.push(`课堂吸收 ${R.absorption.keys.length} 项`);
  return p.length ? p.join(' 或 ') : '未启用任何条件';
}
function epStore(date){
  const c = activeClass(); if (!c) return {};
  c.extraPractice = c.extraPractice || {};
  if (!c.extraPractice[date]) c.extraPractice[date] = {};
  return c.extraPractice[date];
}
function epExcl(date){
  const c = activeClass(); if (!c) return {};
  c.extraPracticeEx = c.extraPracticeEx || {};
  if (!c.extraPracticeEx[date]) c.extraPracticeEx[date] = {};
  return c.extraPracticeEx[date];
}
/* 按当前规则计算命中的学生及命中原因（不写入记录，用 recRaw 只读） */
function epRuleHits(date){
  const c = activeClass(); if (!c) return [];
  const R = EPR(); const out = [];
  c.students.forEach(s => {
    const r = recRaw(s, date); if (!r) return;
    if (R.skipLeave && r.attendance === 'leave') return;
    const reasons = [];
    if (R.quiz.on)     { const v = num(r.quiz);     if (v !== null && v < R.quiz.lt)     reasons.push(`小测${v}分`); }
    if (R.homework.on) { const v = hwEffective(r); if (v !== null && v < R.homework.lt) reasons.push(`作业${v}分`); }
    if (R.behavior.on && R.behavior.keys.length)
      (r.behavior || []).forEach(k => { if (R.behavior.keys.includes(k)) { const o = optOf(BOPTS(), k); reasons.push(o ? (o.short || o.label) : k); } });
    if (R.absorption.on && R.absorption.keys.length)
      (r.absorption || []).forEach(k => { if (R.absorption.keys.includes(k)) { const o = optOf(AOPTS(), k); reasons.push(o ? (o.short || o.label) : k); } });
    if (reasons.length) out.push({ s, reasons });
  });
  return out;
}
function epList(date){
  const c = activeClass(); if (!c) return [];
  const store = (c.extraPractice && c.extraPractice[date]) || {};
  const excl  = (c.extraPracticeEx && c.extraPracticeEx[date]) || {};
  const hits = {};
  if (EPR().auto) epRuleHits(date).forEach(h => { hits[String(h.s.id)] = h.reasons; });
  return c.students
    .filter(s => { const id = String(s.id); return store[id] !== undefined || (hits[id] && !excl[id]); })
    .map(s => {
      const id = String(s.id), manual = store[id] !== undefined;
      return { s, goal: manual ? store[id] : '', auto: !manual, reasons: hits[id] || [] };
    });
}
function epAdd(sid, goal){
  const id = String(sid);
  epStore(state.activeDate)[id] = goal || '';
  delete epExcl(state.activeDate)[id];
  save(); openExtraPractice();
}
function epRemove(sid){
  const id = String(sid);
  delete epStore(state.activeDate)[id];
  epExcl(state.activeDate)[id] = true;   // 记住「已移出」，规则不会再把他自动加回来
  save(); openExtraPractice();
}
function epSetGoal(sid, goal){
  epStore(state.activeDate)[String(sid)] = goal;   // 自动项一旦写目标即固化为手动项
  save();
}
/* 规则命中但当前不在名单里的学生（自动纳入已关闭，或曾被手动移出） */
function epSuggest(date){
  const c = activeClass(); if (!c) return [];
  const store = (c.extraPractice && c.extraPractice[date]) || {};
  const excl  = (c.extraPracticeEx && c.extraPracticeEx[date]) || {};
  const auto  = EPR().auto;
  return epRuleHits(date)
    .filter(h => { const id = String(h.s.id); return store[id] === undefined && (!auto || excl[id]); })
    .map(h => h.s);
}
/* 一键把规则命中的学生全部固化进名单，目标预填命中原因 */
function epApplyRules(){
  const d = state.activeDate;
  const hits = epRuleHits(d);
  if (!hits.length) { toast('当前规则没有命中任何学生'); return; }
  const st = epStore(d), ex = epExcl(d);
  hits.forEach(h => { const id = String(h.s.id); if (st[id] === undefined) st[id] = h.reasons.join('、'); delete ex[id]; });
  save(); openExtraPractice(); toast(`已按规则纳入 ${hits.length} 人`);
}
function epClearDay(){
  const c = activeClass(); if (!c) return;
  const d = state.activeDate;
  if (!confirm(`确定清空 ${d} 的加练名单吗？`)) return;
  c.extraPractice[d] = {};
  epRuleHits(d).forEach(h => { epExcl(d)[String(h.s.id)] = true; }); // 清空后不被规则自动加回
  save(); openExtraPractice(); toast('已清空当日加练名单');
}
/* -------- 加练规则设置面板 -------- */
function epRuleSet(k, v){ state.epRules[k] = v; save(); openEpRules(); }
function epRuleSub(field, k, v){
  const R = state.epRules;
  R[field][k] = (k === 'lt') ? (num(v) === null ? 0 : num(v)) : v;
  if (k === 'lt') R[field].on = true;
  save(); openEpRules();
}
function epRuleKey(field, key){
  const arr = state.epRules[field].keys;
  const i = arr.indexOf(key);
  if (i >= 0) arr.splice(i, 1); else arr.push(key);
  if (arr.length) state.epRules[field].on = true;
  save(); openEpRules();

/* 进门小测等级判定（按满分 quizScale 换算百分比后与阈值比较），返回 {key, cls} */
function quizLevelOf(score){
  const r = quizRatio(score);
  const t = state.quizThresholds || { excellent:90, good:70, pass:60 }, s = state.quizScale || 100;
  if (r === null) return { key:'—', cls:'' };
  if (r >= t.excellent / s) return { key:'优', cls:'lv-excellent' };
  if (r >= t.good / s)      return { key:'良', cls:'lv-good' };
  if (r >= t.pass / s)      return { key:'中', cls:'lv-pass' };
  return { key:'差', cls:'lv-poor' };
}
function setQuizView(v){ ui.quizView = v; const sr = document.getElementById('statRow'); if (sr) sr.innerHTML = statRowHtml(activeClass(), state.activeDate); }
function openQuizLevels(){
  const t = state.quizThresholds || { excellent:90, good:70, pass:60 };
  const scale = state.quizScale || 100;
  openModal('小测满分与等级线设置', `
    <div class="hint">先设定小测「满分」，录入与着色都按此满分换算；再自定义各等级最低分。依次判定 优 → 良 → 中 → 差（低于「中」归为「差」）。修改满分时等级线会按比例自动折算。</div>
    <div class="form-row"><label>小测满分</label><input class="inp" id="qlvScale" type="number" min="1" max="200" step="1" value="${scale}" onchange="qlvRescale(this.value)"></div>
    <div class="form-row"><label>优 ≥</label><input class="inp" id="qlvE" type="number" min="0" max="${scale}" step="0.5" value="${t.excellent}"></div>
    <div class="form-row"><label>良 ≥</label><input class="inp" id="qlvG" type="number" min="0" max="${scale}" step="0.5" value="${t.good}"></div>
    <div class="form-row"><label>中 ≥</label><input class="inp" id="qlvP" type="number" min="0" max="${scale}" step="0.5" value="${t.pass}"></div>`,
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn primary" onclick="saveQuizLevels()">保存</button>`);
}
/* 修改满分时，按比例折算当前等级线，保持等级比例不变 */
function qlvRescale(newScale){
  const old = state.quizScale || 100;
  const ns = parseFloat(newScale) || old;
  if (ns === old) return;
  const k = ns / old;
  ['qlvE','qlvG','qlvP'].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.value !== ''){ const v = Math.round(parseFloat(el.value) * k * 10) / 10; el.value = v; el.max = ns; }
  });
}
function saveQuizLevels(){
  const newScale = parseFloat(document.getElementById('qlvScale').value);
  if (isNaN(newScale) || newScale <= 0) return toast('请输入有效的满分');
  const e = parseFloat(document.getElementById('qlvE').value);
  const g = parseFloat(document.getElementById('qlvG').value);
  const p = parseFloat(document.getElementById('qlvP').value);
  if (isNaN(e) || isNaN(g) || isNaN(p)) return toast('请输入有效数字');
  if (!(e >= g && g >= p)) return toast('阈值需满足：优 ≥ 良 ≥ 中');
  if (e > newScale || g > newScale || p > newScale) return toast('等级阈值不能大于满分');
  state.quizScale = newScale;
  state.quizThresholds = { excellent:e, good:g, pass:p };
  save(); closeModal(); renderMain(); toast('满分与等级线已保存');
}

function findStudentById(id){
  for (const c of state.classes) {
    const s = c.students.find(x => String(x.id) === String(id));
    if (s) return { s, c };
  }
  return null;
}
/* 读取学生档案（独立于班级的全局数据源）。优先取全局 studentProfiles，
   老数据仍可回退到各班级内嵌的 c.profiles，保证兼容。 */
function profileOf(sid){
  const id = String(sid);
  if (state.studentProfiles && state.studentProfiles[id]) return state.studentProfiles[id];
  for (const c of state.classes) {
    const p = c.profiles && c.profiles[id];
    if (p) {
      const s = c.students.find(x => String(x.id) === id);
      return Object.assign({ id, name: s ? s.name : '', school:'', class:'', remark:'', custom:[] }, p);
    }
  }
  return null;
}
/* 确保某 sid 在学生档案中存在；name 提供时同步姓名（与班级保持一致）。
   创建时从班级内嵌 c.profiles 继承已有字段，兼容旧数据与直接改 c.profiles 的场景。 */
function ensureProfile(sid, name){
  const id = String(sid);
  state.studentProfiles = state.studentProfiles || {};
  if (!state.studentProfiles[id]) {
    const base = { id, name: name != null ? name : '', school:'', class:'', remark:'', custom:[] };
    for (const c of state.classes) {
      const s = c.students.find(x => String(x.id) === id);
      const cp = c.profiles && c.profiles[id];
      if (cp) ['school','class','remark'].forEach(k => { if (cp[k]) base[k] = cp[k]; });
      if (cp && !base.custom.length && Array.isArray(cp.custom)) base.custom = cp.custom;
      if (!base.name && s) base.name = s.name;
    }
    if (!base.name && name != null) base.name = name;
    state.studentProfiles[id] = base;
  } else if (name != null) {
    state.studentProfiles[id].name = name;
  }
  return state.studentProfiles[id];
}

function ui_tagSet(i, field, val){ if (_tagEdit) _tagEdit.list[i][field] = val; }
function tagMove(i, dir){ const a = _tagEdit.list, j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; renderTagEditor(); }
function tagDel(i){ _tagEdit.list.splice(i, 1); renderTagEditor(); }
function tagAdd(){ _tagEdit.list.push({ key: 'tag' + uid(), short: '新标语', label: '新标语', type: 'neutral' }); renderTagEditor(); }
function saveTagEditor(){
  const kind = _tagEdit.kind;
  const field = kind === 'behavior' ? 'behavior' : 'absorption';
  const old = kind === 'behavior' ? state.behaviorOpts : state.absorptionOpts;
  const oldKeys = new Set(old.map(o => o.key));
  const newList = _tagEdit.list.map(o => ({
    key: o.key || 'tag' + uid(), short: o.short || '未命名', label: o.label || o.short || '未命名', type: o.type || 'neutral'
  }));
  const newKeys = new Set(newList.map(o => o.key));
  const removed = [...oldKeys].filter(k => !newKeys.has(k));
  if (removed.length) {
    state.classes.forEach(c => c.students.forEach(s => {
      Object.values(s.records || {}).forEach(r => {
        if (Array.isArray(r[field])) r[field] = r[field].filter(k => !removed.includes(k));
      });
    }));
  }

  save(); closeModal(); toast('标语已更新'); renderMain();
}

/* 信息卡截图：克隆卡片到无高度限制容器，确保内容完整（含滚动部分）后导出 PNG */
async function captureStudentCard(){
  const src = document.getElementById('studentCardShot');
  if (!src) return toast('未找到信息卡内容');
  if (typeof html2canvas === 'undefined') return toast('截图组件未加载，请检查网络');
  toast('正在生成截图…');
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;z-index:-1;padding:0;margin:0;background:#fff';
  const clone = src.cloneNode(true);
  clone.style.width = src.offsetWidth + 'px';
  clone.style.margin = '0';
  holder.appendChild(clone);
  document.body.appendChild(holder);
  try {
    const canvas = await html2canvas(clone, {
      scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
      windowWidth: src.offsetWidth, width: src.offsetWidth,
    });
    holder.remove();
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = '学生档案_' + (window.__scShotName || 'student') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    toast('截图已保存 📸');
  } catch (e) { console.error(e); holder.remove(); toast('截图失败：' + (e && e.message ? e.message : e)); }
}

    p.querySelectorAll('.mp-item').forEach(item => {
      const cb = item.querySelector('input');
      item.classList.toggle('on', cb.checked);
    });
  }
}
function clearMulti(sid, field){
  const f = findStudentById(sid); if (!f) return;
  rec(f.s, state.activeDate)[field] = [];
  save(); closeMulti(); refreshMultiBtn(f.s, field);
}
function refreshMultiBtn(s, field){
  const btn = document.getElementById(`mb-${field}-${s.id}`);
  if (!btn) return;
  const opts = field === 'behavior' ? BOPTS() : AOPTS();
  const sel = rec(s, state.activeDate)[field] || [];
  btn.innerHTML = sel.length
    ? sel.map(k => { const o = optOf(opts, k); return o ? `<span class="chip ${o.type}">${o.short}</span>` : ''; }).join('')
    : '<span style="opacity:.7">点击选择…</span>';
}
document.addEventListener('click', () => closeMulti());
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeMulti(); closeModal(); } });

/* ==================================================================
   Tab 2：出勤统计 (attend)
   ================================================================== */
const ATT_META = {
  present: { label:'出勤', key:'present', chip:'ck-p', mark:'✓',   color:'#16a34a', bg:'#dcfce7' },
  late:    { label:'迟到', key:'late',    chip:'ck-t', mark:'迟',  color:'#ca8a04', bg:'#fffbe8' },
  leave:   { label:'请假', key:'leave',   chip:'ck-l', mark:'请假', color:'#dc2626', bg:'#fff5f5' },
  makeup:  { label:'已补', key:'makeup',  chip:'ck-m', mark:'已补', color:'#1a202c', bg:'#fde68a' },
};

function makeupOf(s, date){ return (s && s.makeups && s.makeups[date]) || ''; }
function setMakeup(s, date, mk){
  s.makeups = s.makeups || {};
  if (mk) s.makeups[date] = mk; else delete s.makeups[date];
}
/* 某生某天的出勤状态；未登记返回 null */
function attStatus(s, date){
  const r = recRaw(s, date);
  if (!r || !r.attendance) return null;
  if (r.attendance === 'leave') return makeupOf(s, date) ? 'makeup' : 'leave';
  return r.attendance === 'late' ? 'late' : 'present';
}
/* 全班上课日：有上课内容的日期 + 任一学生有记录的日期 */
function lessonDates(cls){
  const set = new Set();
  Object.keys(cls.lessons || {}).forEach(d => {
    const L = cls.lessons[d];
    if (L && ((L.content || '').trim() || L.topic)) set.add(d);
  });
  (cls.students || []).forEach(s => Object.keys(s.records || {}).forEach(d => set.add(d)));
  set.delete('');
  return [...set].sort();
}
function monthMeta(ym){
  const [y, m] = ym.split('-').map(Number);
  return { y, m, firstDow: new Date(y, m - 1, 1).getDay(), days: new Date(y, m, 0).getDate() };
}
/* 日期短格式：2026-07-17 → 7/17 */
function mdShort(d){
  if (!d || d.length < 10) return d || '';
  return (+d.slice(5, 7)) + '/' + (+d.slice(8, 10));
}
function dowCN(d){
  const t = new Date(d + 'T00:00:00');
  return isNaN(t) ? '' : '日一二三四五六'[t.getDay()];
}
/* 周末类名：'' | 'we-sat' | 'we-sun' */
function weClass(d){
  const t = new Date(d + 'T00:00:00');
  if (isNaN(t)) return '';
  const w = t.getDay();
  return w === 0 ? 'we-sun' : w === 6 ? 'we-sat' : '';
}

/* -------- 筛选条件 -------- */
function attRange(){
  if (!ui.attRangeInit) {
    const base = state.activeDate || todayStr();
    const y = +base.slice(0, 4), m = +base.slice(5, 7);
    ui.attFrom = `${y}-${String(m).padStart(2,'0')}-01`;
    ui.attTo   = `${y}-${String(m).padStart(2,'0')}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`;
    ui.attRangeInit = true;
  }
  return { from: ui.attFrom || '', to: ui.attTo || '' };
}
function setAttFrom(v){ ui.attFrom = v || ''; ui.attRangeInit = true; renderMain(); }
function setAttTo(v){ ui.attTo = v || ''; ui.attRangeInit = true; renderMain(); }
function setAttStudent(v){ ui.attStudentId = v || ''; renderMain(); }
function setAttScope(v){ ui.attScope = v; ui.attStudentId = ''; renderMain(); }
function attQuick(kind){
  const base = state.activeDate || todayStr();
  if (kind === 'all') { ui.attFrom = ''; ui.attTo = ''; }
  else {
    const d = new Date(+base.slice(0, 4), +base.slice(5, 7) - 1 + (kind === 'prev' ? -1 : 0), 1);
    const y = d.getFullYear(), m = d.getMonth() + 1;
    ui.attFrom = `${y}-${String(m).padStart(2,'0')}-01`;
    ui.attTo   = `${y}-${String(m).padStart(2,'0')}-${String(new Date(y, m, 0).getDate()).padStart(2,'0')}`;
  }
  ui.attRangeInit = true;
  renderMain();
}
function attScopeClasses(){
  if (ui.attScope === 'all') return state.classes || [];
  const c = activeClass();
  return c ? [c] : [];
}
/* 范围内的上课日期（升序）。休息日（attendanceOff）不纳入考勤：仅当某日对范围内所有班级都是休息日时才剔除。 */
function attDates(){
  const { from, to } = attRange();
  const classes = attScopeClasses();
  const set = new Set();
  classes.forEach(c => lessonDates(c).forEach(d => set.add(d)));
  return [...set]
    .filter(d => (!from || d >= from) && (!to || d <= to))
    .filter(d => classes.some(c => !(c.attendanceOff && c.attendanceOff[d])))   // 任一班级上课则该日保留；仅当全部班级休息才剔除
    .sort();
}
/* 范围内被休息日排除的日期（用于汇总提示） */
function attRestDaysInRange(){
  const { from, to } = attRange();
  const classes = attScopeClasses();
  const set = new Set();
  classes.forEach(c => lessonDates(c).forEach(d => set.add(d)));
  return [...set]
    .filter(d => (!from || d >= from) && (!to || d <= to))
    .filter(d => classes.every(c => (c.attendanceOff && c.attendanceOff[d])));
}
/* 参与统计的学生行 */
function attRows(){
  const out = [];
  attScopeClasses().forEach(c => (c.students || []).forEach(s => out.push({ c, s })));
  return ui.attStudentId ? out.filter(x => String(x.s.id) === String(ui.attStudentId)) : out;
}
function attCount(s, dates){
  let p = 0, t = 0, l = 0, mk = 0;
  const c = (state.classes || []).find(x => (x.students || []).some(st => String(st.id) === String(s.id)));
  dates.forEach(d => {
    if (c && c.attendanceOff && c.attendanceOff[d]) return;   // 休息日不计入考勤
    const st = attStatus(s, d);
    if (st === 'present') p++; else if (st === 'late') t++;
    else if (st === 'leave') l++; else if (st === 'makeup') mk++;
  });
  return { p, t, l, mk, total: p + t + mk };
}
function attRangeLabel(){
  const { from, to } = attRange();
  if (!from && !to) return '全部记录';
  if (from && to) {
    if (from.slice(0, 7) === to.slice(0, 7) && +from.slice(8) === 1
        && +to.slice(8) === new Date(+to.slice(0,4), +to.slice(5,7), 0).getDate())
      return `${+from.slice(0,4)} 年 ${+from.slice(5,7)} 月`;
    return `${fmtDateCN(from)} ~ ${fmtDateCN(to)}`;
  }
  return from ? `${fmtDateCN(from)} 起` : `截至 ${fmtDateCN(to)}`;
}

/* ================== 主渲染 ================== */
function renderAttend(){
  const cls = activeClass();
  if (!cls) return '<div class="empty"><span class="ico">🗓️</span>请先在左侧新建班级</div>';
  // 切换班级后若原筛选学生已不在范围内，自动回到「全部学生」
  if (ui.attStudentId && !attScopeClasses().some(c =>
      (c.students || []).some(s => String(s.id) === String(ui.attStudentId)))) ui.attStudentId = '';
  const allRows = attRows();
  const { from, to } = attRange();

      <input type="date" value="${to}" onchange="setAttTo(this.value)">

      <div style="flex:1"></div>

      <button class="btn" onclick="exportAttendCSV()">📤 导出出勤表</button>
    </div>`;

  if (!allRows.length)
    return toolbar + '<div class="empty"><span class="ico">🗓️</span>还没有学生，先到「日常反馈表」添加</div>';

  let P = 0, T = 0, L = 0, M = 0;
  allRows.forEach(({ s }) => { const c = attCount(s, dates); P += c.p; T += c.t; L += c.l; M += c.mk; });
  const GT = P + T + M;
  const restDays = attRestDaysInRange();
  const restNote = restDays.length
    ? ` · <span class="att-rest-note">已排除 ${restDays.length} 个休息日</span>` : '';

  const summary = `
    <div class="att-sum">
      <div class="att-total">
        <div class="at-lbl">总出勤（出勤 + 迟到 + 补课）=<br>
          <span style="font-size:11px;opacity:.85;font-weight:700">${attRangeLabel()} · ${
            ui.attStudentId ? esc((allRows[0] || {}).s.name) : allRows.length + ' 名学生'} · ${dates.length} 个上课日${restNote}</span></div>
        <div class="at-num">${GT}</div><div class="at-unit">次</div>
      </div>
      ${attCntBox('出勤', P, 'var(--green)')}
      ${attCntBox('迟到', T, '#ca8a04')}
      ${attCntBox('请假', L, 'var(--red)')}
      ${attCntBox('补课', M, '#a06d04')}
    </div>`;

  const docs = (cls.attendanceDocs || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const gallery = docs.length ? `
    <div class="att-docs">
      <div class="att-docs-t">📎 纸质出勤登记表（${docs.length}）<span class="muted" style="font-weight:600">· 仅本地保存，点击放大查看</span></div>
      <div class="att-docs-grid">
        ${docs.map(d => `<div class="att-doc" id="attdoc-${d.id}">
          <button class="att-doc-img" onclick="previewDoc('${d.fileKey}','${esc(d.fileName)}')" title="点击放大">${d.type && d.type.startsWith('image/') ? `<img alt="">` : `<span class="att-doc-ico">${fileIcon(d.fileName, d.type)}</span>`}</button>
          <div class="att-doc-meta">
            <div class="att-doc-title" title="${esc(d.title || d.fileName)}">${esc(d.title || d.fileName)}</div>
            <div class="att-doc-sub">${d.date ? fmtDateCN(d.date) : '未标注日期'}</div>
          </div>
          <button class="att-doc-del" onclick="delAttDoc('${d.id}')" title="删除">×</button>
        </div>`).join('')}
      </div>
    </div>` : '';

  if (!dates.length)
    return toolbar + summary + gallery + '<div class="empty"><span class="ico">🗓️</span>所选日期范围内没有上课记录，换个范围或点「全部」试试</div>';

  const rateOf = n => { const base = n.p + n.t + n.l + n.mk; return base ? Math.round((n.p + n.t + n.mk) / base * 100) : 0; };
  const rateColor = r => r >= 95 ? 'var(--green)' : r >= 85 ? '#16a34a' : r >= 70 ? '#ca8a04' : 'var(--red)';
  const rateBg = r => r >= 95 ? 'var(--green-light)' : r >= 85 ? '#e7f6ec' : r >= 70 ? '#fffbe8' : 'var(--red-light)';
  const body = allRows.map(({ c, s }) => {

      <td class="atc-cls"><i class="class-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${

      <td class="c atc-n" style="color:${n.t ? '#ca8a04' : 'var(--text-muted)'}">${n.t || '—'}</td>
      <td class="c atc-n" style="color:${n.l ? 'var(--red)' : 'var(--text-muted)'}">${n.l || '—'}</td>
      <td class="c atc-n" style="color:${n.mk ? '#a06d04' : 'var(--text-muted)'}">${n.mk || '—'}</td>

  const foot = `<tr class="att-foot">

      <td class="c atc-n" style="color:#ca8a04">${T}</td>
      <td class="c atc-n" style="color:var(--red)">${L}</td>
      <td class="c atc-n" style="color:#a06d04">${M}</td>
      <td class="c atc-rate"><b>${GT ? Math.round((P + T + M) / (P + T + L + M) * 100) : 0}%</b></td>

        allRows.forEach(({ c, s }) => {

        });
        return `<td class="atc-d ${weClass(d)}" style="font-size:11.5px;color:var(--text-secondary)">${a}</td>`;
      }).join('')}
    </tr>`;

  const table = `<div class="tbl-wrap att-scroll">
    <table class="tbl att-tbl">
      <thead><tr>
        <th class="atc-name">学生</th>
        <th class="atc-cls">班级</th>
        <th class="c atc-sum">总出勤</th>
        <th class="c atc-n">出勤</th>
        <th class="c atc-n">迟到</th>
        <th class="c atc-n">请假</th>
        <th class="c atc-n">补课</th>
        <th class="c atc-rate">出勤率</th>

      </tr></thead>
      <tbody>${body}${foot}</tbody>
    </table>
  </div>
  <div class="cal-legend">
    <span><i class="lg-dot" style="background:#dcfce7;border-color:#bbf0c8"></i>✓ 出勤</span>
    <span><i class="lg-dot" style="background:#fffbe8;border-color:#f4e79a"></i><b style="color:#ca8a04">迟</b> 迟到</span>
    <span><i class="lg-dot" style="background:#fff5f5;border-color:#f8c6c6"></i><b style="color:#dc2626">请假</b></span>
    <span><i class="lg-dot" style="background:#fde68a;border-color:#e6c65c"></i><b style="color:#1a202c">已补</b> 补课（含日期）</span>
    <span><i class="lg-dot" style="background:#f2f7fe;border-color:#e7e2f2"></i>周末浅底</span>
    <span><i class="lg-dot" style="background:var(--accent-light);border-color:var(--accent)"></i>今日列高亮</span>

  return toolbar + summary + gallery + table + attPendingHtml();
}

function attCntBox(lbl, v, color){
  return `<div class="att-cnt"><div class="ac-bar" style="background:${v ? color : 'var(--border-strong)'}"></div>
    <div class="ac-l">${lbl}</div>
    <div class="ac-v" style="color:${v ? color : 'var(--text-muted)'}">${v}<small>次</small></div></div>`;
}

/* -------- 单元格 -------- */
function attCellHtml(c, s, d){
  const wc = weClass(d), tcl = (d === todayStr()) ? 'today' : '';
  const tdcls = 'atc-d ' + wc + (wc ? ' ' : '') + tcl;
  // 该生所在班级当天为休息日：不登记考勤（不可点击）
  if (c.attendanceOff && c.attendanceOff[d])
    return `<td class="${tdcls} att-rest-cell" title="${fmtDateCN(d)} · 休息日（不计入考勤）"><span class="att-rest-pill">🌴 休</span></td>`;
  const st = attStatus(s, d);
  const args = `'${c.id}','${s.id}','${d}'`;
  const chip = (cls, txt) => `<button class="att-chip ${cls}" onclick="openAttPop(event,${args})"
    title="${esc(s.name)} · ${fmtDateCN(d)}　点击修改">${txt}</button>`;
  if (!st) return `<td class="${tdcls}">${chip('ck-n', '·')}</td>`;
  if (st === 'present') return `<td class="${tdcls}">${chip('ck-p', '✓')}</td>`;
  if (st === 'late')    return `<td class="${tdcls}">${chip('ck-t', '迟')}</td>`;
  const mk = makeupOf(s, d);
  if (st === 'leave')
    return `<td class="${tdcls}">${chip('ck-l', '请假')}
      <input type="date" class="att-mkin" min="${d}" value="" title="选择补课日期"
        onchange="tblMakeup(${args},this.value)"></td>`;
  return `<td class="${tdcls}">${chip('ck-m', '已补 ' + mdShort(mk))}
    <input type="date" class="att-mkin done" min="${d}" value="${mk}" title="修改补课日期"
      onchange="tblMakeup(${args},this.value)"></td>`;
}

function attFind(cid, sid){
  const c = (state.classes || []).find(x => String(x.id) === String(cid));
  if (!c) return null;
  const s = (c.students || []).find(x => String(x.id) === String(sid));
  return s ? { c, s } : null;
}
/* 在表格里直接选补课日期 */
function tblMakeup(cid, sid, date, v){
  const f = attFind(cid, sid); if (!f) return;
  if (v && v < date) { toast('补课日期不能早于缺课日期'); renderMain(); return; }
  const r = rec(f.s, date);
  if (v) r.attendance = 'leave';
  setMakeup(f.s, date, v || '');
  save(); renderMain();
  toast(v ? `已登记补课 ${mdShort(v)}` : '已清除补课日期');
}
/* 出勤状态浮动面板 */
function openAttPop(ev, cid, sid, date){
  ev.stopPropagation();
  const exist = document.getElementById('multiPanel');
  const k = 'att' + cid + sid + date;
  const same = exist && exist.dataset.k === k;
  closeMulti();
  if (same) return;
  const f = attFind(cid, sid); if (!f) return;
  const r = recRaw(f.s, date);
  const cur = (r && r.attendance) || '';
  const mk = makeupOf(f.s, date);
  const p = document.createElement('div');
  p.className = 'multi-panel att-pop';
  p.id = 'multiPanel';
  p.dataset.k = k;
  p.onclick = e => e.stopPropagation();
  p.innerHTML = `
    <div class="mp-head"><span>${esc(f.s.name)} · ${mdShort(date)}</span>
      <button class="close-x" onclick="closeMulti()">×</button></div>
    <div style="padding:11px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:6px">
        ${ATTENDANCE_OPTS.map(o => `<button class="tg ${cur === o.key ? 'on' : ''}" style="flex:1;justify-content:center"
          onclick="setAttCell('${cid}','${sid}','${date}','${o.key}')">${o.label}</button>`).join('')}
      </div>
      ${cur === 'leave' ? `
        <label style="font-size:11.5px;font-weight:800;color:var(--text-muted)">补课日期</label>
        <input type="date" min="${date}" value="${mk}" style="padding:6px 9px;font-size:12.5px;font-family:inherit;
          border:1px solid var(--border-strong);border-radius:8px"
          onchange="tblMakeup('${cid}','${sid}','${date}',this.value)">` : ''}
      <button class="btn" onclick="setAttCell('${cid}','${sid}','${date}','')">清除本次登记</button>
    </div>`;
  document.body.appendChild(p);
  const rect = ev.currentTarget.getBoundingClientRect();
  const w = 246, ph = Math.min(p.scrollHeight + 4, window.innerHeight * 0.6);
  let left = rect.left - 40, top = rect.bottom + 6;
  if (left + w > window.innerWidth - 10) left = window.innerWidth - w - 10;
  if (left < 10) left = 10;
  if (top + ph > window.innerHeight - 10) top = Math.max(10, rect.top - ph - 6);
  p.style.left = left + 'px';
  p.style.top = top + 'px';
}
function setAttCell(cid, sid, date, key){
  const f = attFind(cid, sid); if (!f) return;
  if (!key) {
    const r = recRaw(f.s, date);
    if (r) {
      const hwHas = state.hwMode === 'done' ? (r.hwDone !== undefined) : (String(r.homework || '').trim() !== '');
      const bare = !String(r.quiz || '').trim() && !hwHas
        && !(r.behavior || []).length && !(r.absorption || []).length;
      if (bare) delete f.s.records[date]; else r.attendance = '';
    }
    setMakeup(f.s, date, '');
  } else {
    rec(f.s, date).attendance = key;
    if (key !== 'leave') setMakeup(f.s, date, '');
  }
  closeMulti(); save(); renderMain();
  toast(key ? '已登记' + (ATT_META[key] || {}).label : '已清除登记');
}

function exportAttendCSV(){

  let P = 0, T = 0, L = 0, M = 0;

/* ==================================================================
   Tab 3：测试分析 (trend)
   ================================================================== */
function setTrendScope(v){ state.trendScope = v; save(); renderMain(); }
function setTrendPass(v){ const n = parseFloat(v); state.trendPass = isNaN(n) ? 60 : Math.max(0, Math.min(100, n)); save(); renderMain(); }
/* 把序列原始分折算到 0-100 图表百分比坐标：作业×10（10 分制→百分制）；小测按 quizScale 折算为百分比，满分 10 与 100 都能正确反映 */
function plotVal(key, v){ return key === 'homework' ? v * 10 : (state.quizScale ? v / state.quizScale * 100 : v); }
function renderTrend(){
  const cls = activeClass();
  if (!cls.students.length) return '<div class="empty"><span class="ico">📈</span>本班还没有学生</div>';
  if (!state.trendStudentId || !cls.students.some(s => String(s.id) === String(state.trendStudentId))) {
    state.trendStudentId = cls.students[0].id;
  }
  const stu = cls.students.find(s => String(s.id) === String(state.trendStudentId));
  const pass = Math.max(0, Math.min(100, +state.trendPass || 60));
  const scope = state.trendScope || 'both';
  const allSeries = [
    { key:'quiz', color:'#2563eb', label:LBL('quiz') + '（满分 ' + (state.quizScale || 100) + '）' },
    { key:'homework', color:'#16a34a', label:LBL('homework') + '（满分 10，×10 折算）' },
  ];
  const series = allSeries.filter(se => scope === 'both' || scope === se.key);
  const sval = (r, key) => key === 'homework' ? hwEffective(r) : num(r[key]);

  const dates = Object.keys(stu.records || {})
    .filter(d => series.some(se => sval(stu.records[d], se.key) !== null))
    .sort();

  const sel = `<select class="sel" onchange="state.trendStudentId=this.value;save();renderMain()">
      ${cls.students.map(s => `<option value="${s.id}" ${String(s.id) === String(state.trendStudentId) ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
    </select>`;

  const scopeBtns = `<span class="ta-seg">
      <button class="${scope === 'both' ? 'on' : ''}" onclick="setTrendScope('both')">两者</button>
      <button class="${scope === 'quiz' ? 'on' : ''}" onclick="setTrendScope('quiz')">仅${esc(LBL('quiz'))}</button>
      <button class="${scope === 'homework' ? 'on' : ''}" onclick="setTrendScope('homework')">仅${esc(LBL('homework'))}</button>
    </span>`;

  if (!dates.length) {
    return `<div class="card"><div class="row" style="flex-wrap:wrap;gap:10px;align-items:center">
        <span><b>选择学生：</b>${sel}</span>
        <span style="margin-left:auto">分析范围 ${scopeBtns}　达标分（百分制）
          <input class="inp ta-pass" type="number" min="0" max="100" step="1" value="${pass}" onchange="setTrendPass(this.value)"></span>
      </div></div>
      <div class="empty"><span class="ico">📉</span>${esc(stu.name)} 在所选范围内还没有成绩记录</div>`;
  }

  const W = Math.max(660, dates.length * 82 + 80), H = 320;
  const PL = 44, PR = 24, PT = 20, PB = 46;
  const iw = W - PL - PR, ih = H - PT - PB;
  const x = i => PL + (dates.length === 1 ? iw / 2 : (iw * i / (dates.length - 1)));
  const y = v => PT + ih - (v / 100) * ih;   // 0-100 百分制纵轴

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for (let v = 0; v <= 100; v += 20) {
    svg += `<line x1="${PL}" y1="${y(v)}" x2="${W - PR}" y2="${y(v)}" stroke="#e2ecf9" stroke-width="1"/>`;
    svg += `<text x="${PL - 9}" y="${y(v) + 4}" font-size="11" fill="#8a94a6" text-anchor="end">${v}</text>`;
  }
  svg += `<line x1="${PL}" y1="${y(pass)}" x2="${W - PR}" y2="${y(pass)}" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4" opacity=".7"/>`;
  svg += `<text x="${W - PR - 2}" y="${y(pass) - 6}" font-size="10.5" fill="#16a34a" text-anchor="end">达标线 ${pass} 分</text>`;
  dates.forEach((d, i) => {
    svg += `<text x="${x(i)}" y="${H - PB + 20}" font-size="10.5" fill="#8a94a6" text-anchor="middle">${d.slice(5)}</text>`;
  });
  series.forEach(se => {
    const pts = dates.map((d, i) => ({ i, v: sval(stu.records[d], se.key) })).filter(p => p.v !== null);
    if (pts.length > 1) {
      svg += `<polyline fill="none" stroke="${se.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
        points="${pts.map(p => `${x(p.i)},${y(plotVal(se.key, p.v))}`).join(' ')}"/>`;
    }
    pts.forEach(p => {
      const py = y(plotVal(se.key, p.v));
      svg += `<circle cx="${x(p.i)}" cy="${py}" r="4.5" fill="#fff" stroke="${se.color}" stroke-width="2.5"/>`;
      svg += `<text x="${x(p.i)}" y="${py - 11}" font-size="10.5" font-weight="700" fill="${se.color}" text-anchor="middle">${p.v}</text>`;
    });
  });
  svg += `<line x1="${PL}" y1="${PT}" x2="${PL}" y2="${PT + ih}" stroke="#c3d8f2"/>`;
  svg += `<line x1="${PL}" y1="${PT + ih}" x2="${W - PR}" y2="${PT + ih}" stroke="#c3d8f2"/>`;
  svg += `</svg>`;

  const avgOf = key => {
    const vs = dates.map(d => sval(stu.records[d], key)).filter(v => v !== null);
    return vs.length ? vs.reduce((a, b) => a + b, 0) / vs.length : null;
  };
  /* 达标率：小测原值、作业×10 后与 pass（百分制）比较 */
  const passRate = key => {
    const vs = dates.map(d => sval(stu.records[d], key)).filter(v => v !== null);
    if (!vs.length) return null;
    return Math.round(vs.filter(v => plotVal(key, v) >= pass).length / vs.length * 100);
  };
  const cards = series.map(se => {
    const a = avgOf(se.key);
    const pr = passRate(se.key);
    const cnt = dates.map(d => sval(stu.records[d], se.key)).filter(v => v !== null).length;
    /* 颜色按「百分比」判定：小测按 quizScale 折算，作业×10，与图表纵轴一致 */
    const aPct = a === null ? null : (se.key === 'quiz' ? a / (state.quizScale || 100) * 100 : a * 10);
    return `<div class="avg-card">
      <div class="ac-l">${se.label}平均分</div>
      <div class="ac-v ${a !== null ? valClass(aPct) : ''}">${a !== null ? fmt1(a) : '—'}</div>
      <div class="hint">共 ${cnt} 次记录 · 达标率 ${pr !== null ? pr + '%' : '—'}</div>
    </div>`;
  }).join('');

  return `
    <div class="card"><div class="row" style="flex-wrap:wrap;gap:10px;align-items:center">
      <span><b>选择学生：</b>${sel}</span>
      <span class="muted">共 ${dates.length} 天有成绩记录（${dates[0]} ~ ${dates[dates.length - 1]}）</span>
      <span style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="ta-label">分析范围</span>${scopeBtns}
        <span class="ta-label">达标分（百分制）</span>
        <input class="inp ta-pass" type="number" min="0" max="100" step="1" value="${pass}" onchange="setTrendPass(this.value)">
      </span>
    </div></div>
    <div class="chart-box">
      <div class="legend">
        ${series.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('')}
        <span><i style="background:#16a34a;opacity:.6"></i>${pass} 分达标线</span>
      </div>
      ${svg}
      <div class="hint" style="margin-top:6px">💡 纵轴为百分制（0–100）；家庭作业分数已×10 折算后与小测同图对比，方便看相对走势。</div>
    </div>
    <div class="avg-cards">${cards}</div>`;
}
/* ==================================================================
   Tab 4：打卡登记 (checkin)
   状态：done=按时打卡 / makeup=补卡（记补卡日期） / miss=未完成（红底高光）
        off=免打卡日 / na=打卡开始日之前 / future=未到
   ================================================================== */
function ckMonth(){
  if (!ui.ckMonth) ui.ckMonth = (state.activeDate || todayStr()).slice(0, 7);
  return ui.ckMonth;
}
function ckSetMonth(m){ ui.ckMonth = m; renderMain(); }
function ckShiftMonth(n){
  const [y, m] = ckMonth().split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  ui.ckMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  renderMain();
}
function ckDays(month){
  const [y, m] = month.split('-').map(Number);
  const n = new Date(y, m, 0).getDate();
  const out = [];
  for (let i = 1; i <= n; i++) out.push(`${month}-${String(i).padStart(2, '0')}`);
  return out;
}
function ckStore(date){
  const c = activeClass(); if (!c) return {};
  c.checkins = c.checkins || {};
  if (!c.checkins[date]) c.checkins[date] = {};
  return c.checkins[date];
}
function ckRec(cls, sid, date){
  return (cls.checkins && cls.checkins[date] && cls.checkins[date][String(sid)]) || null;
}
function ckState(cls, sid, date){
  if (cls.checkinOff && cls.checkinOff[date]) return 'off';
  if (cls.checkinStart && date < cls.checkinStart) return 'na';
  const r = ckRec(cls, sid, date);
  if (r && r.st === 'done') return 'done';
  if (r && r.st === 'makeup') return 'makeup';
  if (date > todayStr()) return 'future';
  return 'miss';   // 应打卡却没有记录 → 未完成
}
function ckMark(sid, date, st, at){
  const c = activeClass(); if (!c) return;
  const id = String(sid);
  const store = ckStore(date);
  const cur = store[id] || {};
  if (st === 'miss'){
    cur.st = 'miss';            // 标记未完成：保留备注 / 掌握度 / 附件，仅更新状态
    delete cur.at;
  } else {
    cur.st = st;
    if (at) cur.at = at; else if (st === 'done') delete cur.at;
  }
  store[id] = cur;
  save(); renderMain();
}
function ckToggle(sid, date){
  const c = activeClass(); if (!c) return;
  ckMark(sid, date, ckState(c, sid, date) === 'done' ? 'miss' : 'done');
}
function ckToggleOff(date){
  const c = activeClass(); if (!c) return;
  c.checkinOff = c.checkinOff || {};
  if (c.checkinOff[date]) delete c.checkinOff[date]; else c.checkinOff[date] = true;
  const now = !!c.checkinOff[date];
  save(); renderMain();
  toast(now ? `${date} 已设为「免打卡日」（不计入完成率）` : `${date} 已恢复为「打卡日」`);
}
/* ===== 考勤要求：上课日 / 休息日（按寒暑假、春秋季灵活设置，仅影响「日常反馈」） ===== */
function weekDates(ref){
  const d = new Date(ref + 'T00:00:00');
  const day = d.getDay();                       // 0=周日 … 6=周六
  const off = (day === 0 ? -6 : 1 - day);       // 以周一为一周起点
  const mon = new Date(d); mon.setDate(d.getDate() + off);
  const out = [];
  for (let i = 0; i < 7; i++){ const x = new Date(mon); x.setDate(mon.getDate() + i); out.push(todayStr(x)); }
  return out;
}
function attToggleDay(date){
  const c = activeClass(); if (!c) return;
  c.attendanceOff = c.attendanceOff || {};
  if (c.attendanceOff[date]) delete c.attendanceOff[date]; else c.attendanceOff[date] = true;
  const rest = !!c.attendanceOff[date];
  save(); renderMain();
  toast(`${fmtDateCN(date)} 已设为${rest ? '休息日（日常反馈不统计）' : '上课日（正常考勤）'}`);
}
function openAttendModal(scope){
  const c = activeClass(); if (!c) return;
  const ref = state.activeDate || todayStr();
  const dates = scope === 'week' ? weekDates(ref) : ckDays(ref.slice(0, 7));
  let rest = 0, cls = 0;
  dates.forEach(dt => { (c.attendanceOff && c.attendanceOff[dt]) ? rest++ : cls++; });
  const label = scope === 'week' ? '本周（周一至周日）' : '本月';
  openModal(`🗓️ ${label}考勤要求（日常反馈）`, `
    <p class="muted" style="margin:0 0 12px">为 <b>${label}</b> 统一设置上课 / 休息安排（当前：上课 ${cls} 天 · 休息 ${rest} 天）。<b>此设置仅影响日常反馈表</b>（不考勤、不计积分等），不影响每日打卡，打卡请在「每日打卡」单独设置。</p>
    <div class="att-opt" onclick="applyAttend('${scope}','weekday')">
      <div class="att-opt-t">📅 工作日上课 · 周末休息</div>
      <div class="att-opt-d">周一至周五为上课日，周六周日为休息日（最常用）</div>
    </div>
    <div class="att-opt" onclick="applyAttend('${scope}','allClass')">
      <div class="att-opt-t">🟢 全部上课日</div>
      <div class="att-opt-d">该范围内每一天都正常考勤、计入统计（如春秋季连续上课）</div>
    </div>
    <div class="att-opt" onclick="applyAttend('${scope}','allRest')">
      <div class="att-opt-t">☕ 全部休息日</div>
      <div class="att-opt-d">该范围内每一天都不考勤、不计入统计（如寒暑假）</div>
    </div>`,
    `<button class="btn" onclick="closeModal()">取消</button>`, 500);
}
function applyAttend(scope, pattern){
  const c = activeClass(); if (!c) return;
  c.attendanceOff = c.attendanceOff || {};
  const ref = state.activeDate || todayStr();
  const dates = scope === 'week' ? weekDates(ref) : ckDays(ref.slice(0, 7));
  dates.forEach(dt => {
    const wd = new Date(dt + 'T00:00:00').getDay();
    const isWeekend = (wd === 0 || wd === 6);
    if (pattern === 'allClass') delete c.attendanceOff[dt];
    else if (pattern === 'allRest') c.attendanceOff[dt] = true;
    else { if (isWeekend) c.attendanceOff[dt] = true; else delete c.attendanceOff[dt]; }
  });
  save(); closeModal(); renderMain();
  toast(scope === 'week' ? '本周考勤要求已应用' : '本月考勤要求已应用');
}
function ckAllDone(date){
  const c = activeClass(); if (!c || !c.students.length) return;
  const st = ckStore(date);
  let n = 0;
  c.students.forEach(s => { const id = String(s.id); if (!st[id]) { st[id] = { st:'done' }; n++; } });
  save(); renderMain(); toast(`${date} 已全班打卡（新增 ${n} 人）`);
}
function ckClearDay(date){
  const c = activeClass(); if (!c) return;

/* 学生某月统计：need=应打卡天数，done=已完成（含补卡），makeup=补卡数，miss=未完成 */
function ckStats(cls, sid, month){
  let need = 0, done = 0, makeup = 0, miss = 0;
  ckDays(month).forEach(d => {
    const s = ckState(cls, sid, d);
    if (s === 'off' || s === 'na' || s === 'future') return;
    need++;
    if (s === 'done') done++;
    else if (s === 'makeup') { done++; makeup++; }
    else miss++;
  });
  return { need, done, makeup, miss, rate: need ? Math.round(done / need * 100) : 0 };
}

async function saveCkFile(sid, date){

            <div class="ck-doc-meta">${bytes(it.size)}</div>

function saveProfileEditor(id){

/* 考试成绩的学生名单与「学生档案」绑定：取「在班学生 ∪ 已退班但仍有成绩记录的学生」的并集，
   因此从「日常反馈表」删除学生不会连带隐藏其考试成绩；退班学生的姓名取自学生档案。 */
function examStudentList(cls){
  const list = (cls.students || []).map(s => ({ id: s.id, name: s.name, inClass: true }));
  const seen = new Set(list.map(x => String(x.id)));
  Object.keys(cls.examScores || {}).forEach(sid => {
    if (seen.has(String(sid))) return;
    const p = profileOf(sid);
    list.push({ id: sid, name: p ? p.name : ('' + sid), inClass: false });
  });
  return list;
}
function renderExam(){

    return `<tr>

        <td><input class="cell-in c" value="${esc(d.mathGrade || '')}" onchange="setExam(${s.id},'${p}','mathGrade',this.value)"></td>
        <td><input class="cell-in c" value="${esc(d.totalScore || '')}" onchange="setExam(${s.id},'${p}','totalScore',this.value)"></td>

      }).join('')}
      ${ZHONGKAO_SUBJECTS.map((sub, i) => `<td style="${i === 0 ? 'border-left:2px solid var(--accent)' : ''}">
