<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课堂记录工作台</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef4fd; --surface:#ffffff; --surface-alt:#f6faff;
  --text:#12233d; --text-secondary:#41546f; --text-muted:#7d8ca3;
  --border:#e2ecf9; --border-strong:#c3d8f2;
  --accent:#2563eb; --accent-light:#dbeafe; --accent-dark:#1d4ed8;
  --accent-soft:#eff6ff; --accent-deep:#1e3a8a; --sky:#38bdf8;
  --green:#16a34a; --green-light:#dcfce7;
  --red:#dc2626; --red-light:#fee2e2;
  --yellow:#ca8a04; --yellow-light:#fef9c3;
  --orange:#ea7c1c; --orange-light:#fef3e2;
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#9dbcea}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ============ SIDEBAR ============ */
.sidebar{width:220px;min-width:220px;background:linear-gradient(180deg,#3b82f6 0%,#1d4ed8 62%,#1e40af 100%);
  color:#fff;display:flex;flex-direction:column;gap:14px;padding:18px 13px;overflow-y:auto}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.35)}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;
  border-bottom:1px solid rgba(255,255,255,.22)}
.bt-main{font-size:17px;font-weight:800;letter-spacing:.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  border-radius:8px;padding:3px 8px;margin:-3px -8px;transition:.15s}
.bt-main:hover{background:rgba(255,255,255,.16)}
.bt-edit{font-size:12px;font-weight:700;opacity:0;background:rgba(255,255,255,.22);border-radius:6px;
  width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.bt-main:hover .bt-edit{opacity:1}
.bt-sub{font-size:12.5px;font-weight:600;opacity:.92}
.bt-tag{font-size:10.5px;opacity:.72;letter-spacing:2px;margin-top:2px}
.side-title{font-size:10.5px;opacity:.78;letter-spacing:2px;font-weight:700;margin:2px 3px;
  display:flex;align-items:center;justify-content:space-between}
.class-list{display:flex;flex-direction:column;gap:7px}
.class-row{position:relative;display:flex;align-items:stretch;border-radius:var(--radius-sm);overflow:hidden;
  background:rgba(255,255,255,.16);transition:.16s}
.class-row:hover{background:rgba(255,255,255,.28)}
.class-row.active{background:#fff;box-shadow:0 4px 12px rgba(20,55,120,.2)}
.class-btn{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:10px 4px 10px 12px;background:none;color:#fff;font-weight:700;text-align:left;flex:1;min-width:0}
.class-row.active .class-btn{color:var(--accent-dark)}
.class-btn .cb-name{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.class-btn .cb-name em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.class-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.class-btn .cb-count{font-size:11px;opacity:.85;font-weight:600;flex:0 0 auto}
.class-edit{width:26px;flex:0 0 auto;font-size:12px;opacity:0;color:#fff;transition:.14s}
.class-row:hover .class-edit{opacity:.85}
.class-row.active .class-edit{color:var(--accent-dark);opacity:.5}
.class-edit:hover{opacity:1 !important;transform:scale(1.15)}
.class-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:9px;
  border-radius:var(--radius-sm);border:1.5px dashed rgba(255,255,255,.5);color:#fff;
  font-size:12.5px;font-weight:700;transition:.16s}
.class-add:hover{background:rgba(255,255,255,.2);border-color:#fff}
.class-empty{font-size:11.5px;opacity:.75;text-align:center;padding:8px 4px;line-height:1.5}
.color-picks{display:flex;flex-wrap:wrap;gap:9px}
.color-pick{width:32px;height:32px;border-radius:10px;border:3px solid transparent;transition:.14s}
.color-pick:hover{transform:scale(1.1)}
.color-pick.on{border-color:var(--text);transform:scale(1.1)}
.blank-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:80px 20px;text-align:center}
.blank-state .bs-icon{font-size:52px;opacity:.85}
.blank-state .bs-title{font-size:17px;font-weight:800;color:var(--text)}
.blank-state .bs-desc{font-size:13px;color:var(--text-muted);line-height:1.7;max-width:420px}
.side-action{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.16);font-weight:700;font-size:13.5px;transition:.16s}
.side-action:hover{background:rgba(255,255,255,.3);transform:translateX(2px)}
.todo-box{background:rgba(255,255,255,.14);border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;gap:8px}
.todo-input-row{display:flex;gap:5px}
.todo-input-row input{flex:1;min-width:0;border:none;border-radius:8px;padding:7px 8px;font-size:12px;background:rgba(255,255,255,.92);color:#333}
.todo-add{background:#fff;color:var(--accent-dark);border-radius:8px;width:30px;font-weight:800;font-size:16px;line-height:1}
.todo-list{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow-y:auto}
.todo-item{display:flex;align-items:flex-start;gap:6px;font-size:12px;background:rgba(255,255,255,.14);padding:6px 7px;border-radius:7px}
.todo-item input[type=checkbox]{margin-top:2px;accent-color:#fff;cursor:pointer;flex:0 0 auto}
.todo-item span{flex:1;line-height:1.35;word-break:break-all}
.todo-item.done span{text-decoration:line-through;opacity:.6}
.todo-del{opacity:.7;font-size:13px;line-height:1}
.todo-del:hover{opacity:1}
.todo-clear{font-size:11px;opacity:.85;text-decoration:underline;align-self:flex-start}
.todo-empty{font-size:11px;opacity:.65;text-align:center;padding:6px 0}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-title h1{font-size:19px;font-weight:800;letter-spacing:.3px}
.top-title p{font-size:12px;color:var(--text-muted);margin-top:2px}
.top-spacer{flex:1}
.save-status{font-size:12px;color:var(--text-muted);white-space:nowrap}
.btn{padding:7px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;
  background:var(--surface-alt);color:var(--text-secondary);border:1px solid var(--border);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--accent-light);border-color:var(--border-strong);color:var(--accent-dark)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-dark)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#f5c9c9}
.btn.danger:hover{background:var(--red-light);color:var(--red)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.top-date{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-alt);font-size:12.5px;font-weight:600}

/* ===== 周测月考：筛选 / 批量 / 按学校登记 ===== */
.weekly-filters{flex-wrap:wrap;gap:8px}
.weekly-filters .muted{font-size:12.5px}
.bind-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent-light);border-radius:999px;padding:2px 9px;white-space:nowrap}
.drill-block{margin-top:14px;border-top:1px dashed var(--border);padding-top:12px}
.card-title.sm{font-size:14px;margin-bottom:2px}
.batch-box{display:flex;flex-direction:column;gap:8px}
.batch-ta{width:100%;min-height:170px;border:1px solid var(--border-strong);border-radius:var(--radius);padding:10px 12px;
  font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;line-height:1.55}
.batch-ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.batch-preview .tbl-wrap{max-height:300px}
.sg-ctrl{flex-wrap:wrap;gap:8px}
.sg-ctrl .pe-lbl{margin:0}
.sg-list{display:flex;flex-direction:column;gap:7px;max-height:46vh;overflow:auto;padding-right:4px}
.sg-row{display:flex;align-items:center;gap:12px;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.sg-name{font-size:13.5px;font-weight:700;min-width:120px;display:flex;flex-direction:column;line-height:1.2}
.sg-name small{font-weight:500;font-size:11px}
.sg-score{flex:1;max-width:160px}

.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 13px;border-radius:12px 12px 0 0;font-size:13px;font-weight:700;color:var(--text-muted);
  white-space:nowrap;border-bottom:2.5px solid transparent;transition:.15s;display:flex;align-items:center;gap:5px}
.tab:hover{color:var(--accent-dark);background:var(--surface-alt)}
.tab.active{color:var(--accent-dark);background:var(--accent-light);border-bottom-color:var(--accent)}
.tab[draggable=true]{cursor:grab}
.tab:active{cursor:grabbing}
.tab.drag-over{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-light)}
.tab-grip{opacity:.32;font-size:10px;letter-spacing:-2px;line-height:1;user-select:none}
.tab-reset{flex:0 0 auto;color:var(--text-muted);font-size:15px;padding:9px 11px}
.tab-reset:hover{color:var(--accent);background:var(--surface-alt)}
.content{flex:1;overflow:auto;padding:18px 20px 60px}

/* ============ CARDS / GENERIC ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* === 趋势分析 === */
.trend-card{background:linear-gradient(180deg,#f8fbff,#ffffff)}
.trend-ctrl{margin-bottom:12px}
.seg-toggle{display:inline-flex;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg-btn{border:none;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text-secondary);cursor:pointer;transition:.15s}
.seg-btn.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.trend-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.trend-stat{background:var(--accent-light);color:var(--accent-dark);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:700}
.trend-rank{display:inline-flex;align-items:center;gap:6px;background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--text-secondary)}
.tr-dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.trend-rank small{font-weight:600;color:var(--text-muted)}
.trend-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 8px}
.lg-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-secondary)}
.lg-item i{width:14px;height:4px;border-radius:3px;display:inline-block}
.muted{color:var(--text-muted);font-size:12.5px}
.form-row{display:flex;flex-direction:column;gap:6px;margin:4px 0 10px}
.form-row label{font-size:12.5px;font-weight:700;color:var(--text-muted)}
.inp{padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:var(--input-bg);color:var(--text);outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.empty{text-align:center;padding:40px 20px;color:var(--text-muted);font-size:13px}
.empty .ico{font-size:34px;display:block;margin-bottom:8px;opacity:.5}
.hint{font-size:11.5px;color:var(--text-muted);line-height:1.6}
.hidden{display:none !important}

/* date nav */
.datenav{display:flex;align-items:center;gap:8px}
.datenav .nav-btn{width:30px;height:30px;border-radius:9px;background:var(--surface-alt);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text-secondary)}
.datenav .nav-btn:hover{background:var(--accent-light);color:var(--accent-dark)}
.datenav .cur-date{font-size:15px;font-weight:800;min-width:118px;text-align:center}
input[type=date].dpick{border:1px solid var(--border);background:var(--surface-alt);border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:600}

/* lesson bar */
.lesson-input{flex:1;min-width:200px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;background:var(--surface-alt);font-size:13px}
.lesson-input:focus{border-color:var(--accent);background:#fff}
.topic-btn{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface-alt);
  font-size:12.5px;font-weight:700;color:var(--text-secondary);transition:.15s}
.topic-btn:hover{border-color:var(--accent);color:var(--accent-dark)}
.topic-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* stat blocks */
.stat-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.stat .st-label{font-size:12px;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:5px}
.stat .st-val{font-size:32px;font-weight:800;line-height:1.15;margin:3px 0}
.stat .st-sub{font-size:11.5px;color:var(--text-muted)}
.stat.warn{background:var(--red-light);border-color:#f7cccc}
.stat.warn .st-label{color:var(--red)}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag-red{background:#fff;color:var(--red);border:1px solid #f3b9b9;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.tag-ok{color:var(--green);font-size:13px;font-weight:700;margin-top:8px;display:block}
/* 加练名单：可编辑 */
.mini-edit{margin-left:auto;font-size:11px;font-weight:700;color:var(--red);background:#fff;border:1px solid #f3b9b9;
  border-radius:6px;padding:1px 8px;cursor:pointer;transition:.15s}
.mini-edit:hover{background:var(--red);color:#fff}
.ep-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ep-name{display:inline-flex;align-items:center;font-weight:800;font-size:13px;background:#fff;border:1px solid #f3b9b9;border-radius:999px;padding:4px 12px;color:var(--text)}
.ep-section-title{margin:14px 0 7px;font-size:12px;font-weight:800;color:var(--text-muted);letter-spacing:.5px}
.ep-rows{display:flex;flex-direction:column;gap:7px}
.ep-row{display:flex;align-items:center;gap:8px}
.ep-row .ep-name{font-weight:800;font-size:13px;min-width:60px}
.ep-row .ep-input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;
  background:var(--input-bg);color:var(--text);outline:none}
.ep-row .ep-input:focus{border-color:var(--accent)}
.ep-row .ep-del{border:none;background:#fff0f0;color:var(--red);width:28px;height:30px;border-radius:7px;cursor:pointer;font-weight:800}
.ep-row .ep-del:hover{background:var(--red);color:#fff}
.ep-select{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--input-bg);color:var(--text)}
.ep-empty{font-size:12.5px;color:var(--text-muted);padding:6px 0;opacity:.85}
.ep-suggest{margin-top:14px;background:var(--accent-soft,#eff6ff);border:1px dashed var(--accent,#2563eb);border-radius:10px;padding:10px 12px}
/* === 进门小测一览 === */
.quiz-overview{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.qo-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qo-title{font-size:13px;font-weight:800;color:var(--text)}
.qo-toggle{display:inline-flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:auto}
.qo-toggle button{border:none;background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:700;padding:5px 11px;cursor:pointer}
.qo-toggle button.on{background:var(--accent);color:#fff}
.qo-gear{border:1px solid var(--border)!important;background:var(--input-bg)!important;color:var(--text-muted)!important;border-radius:8px!important;margin-left:4px;cursor:pointer;font-size:13px;padding:4px 8px!important}
.qo-gear:hover{color:var(--accent)!important;border-color:var(--accent)!important}
.qo-range{font-size:12.5px;color:var(--text-muted);margin-top:8px;font-weight:600}
.qo-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qo-chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:var(--input-bg);border:1px solid var(--border);border-radius:999px;padding:3px 10px 3px 10px}
.qo-chip b{font-size:13px}
.qo-chip.s-g{background:#eafaf1;border-color:#bfe9d3;color:#0f9d58}
.qo-chip.s-g b{color:#0f9d58}
.qo-chip.s-r{background:#fff0f0;border-color:#f3b9b9;color:var(--red)}
.qo-chip.s-r b{color:var(--red)}
.qo-chip.s-y{background:#fff8e6;border-color:#f3dfa2;color:#b8860b}
.qo-chip.s-y b{color:#b8860b}
.qo-levels{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.qo-lv{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:800}
.qo-lv b{font-size:24px;line-height:1.1;margin-top:2px}
.qo-lv i{font-style:normal;font-size:11px;font-weight:600;opacity:.8}
.qo-lv.lv-excellent{background:#eafaf1;border:1px solid #bfe9d3;color:#0f9d58}
.qo-lv.lv-good{background:#eef5ff;border:1px solid #c4d8f5;color:#2563eb}
.qo-lv.lv-pass{background:#fff8e6;border:1px solid #f3dfa2;color:#b8860b}
.qo-lv.lv-poor{background:#fff0f0;border:1px solid #f3b9b9;color:var(--red)}
.ep-suggest-title{font-size:12px;font-weight:800;color:var(--accent-deep,#1e3a8a);margin-bottom:7px}
.ep-chips{display:flex;flex-wrap:wrap;gap:7px}
.ep-chip{border:1px solid var(--accent,#2563eb);background:#fff;color:var(--accent-deep,#1e3a8a);border-radius:999px;
  padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s}
.ep-chip:hover{background:var(--accent,#2563eb);color:#fff}
/* 加练规则 */
.ep-auto{font-style:normal;font-size:10px;font-weight:800;background:var(--orange-light);color:var(--orange);
  border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:middle}
.ep-why{font-style:normal;color:var(--orange);opacity:.95}
.ep-rulebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-alt);
  border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px}
.ep-rulebar>div{flex:1;min-width:180px}
.ep-daytip{opacity:.75;font-size:12.5px;line-height:1.6}
.ep-mini{border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);border-radius:6px;
  padding:2px 9px;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px}
.ep-mini:hover{border-color:var(--accent,#2563eb);color:var(--accent,#2563eb)}

.epr-num{width:66px;padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:13px;

.epr-hint{font-size:11px;font-weight:600;color:var(--text-muted);margin-left:6px}
.ep-opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.ep-opt{border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);border-radius:999px;

.ep-opt:hover{border-color:var(--accent,#2563eb)}
.ep-opt.on{background:var(--accent,#2563eb);border-color:var(--accent,#2563eb);color:#fff}
.ep-opt.on.t-negative{background:var(--red);border-color:var(--red)}
.ep-opt.on.t-positive{background:var(--green);border-color:var(--green)}
.ep-opt.on.t-neutral{background:var(--yellow);border-color:var(--yellow)}

/* ============ 打卡登记 ============ */
.ck-bar{margin-bottom:10px}
.ck-sep{width:1px;height:18px;background:var(--border)}
.ck-date{padding:4px 8px;border:1px solid var(--border);border-radius:7px;font-size:12.5px;
  background:var(--input-bg);color:var(--text)}
.ck-legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:9px;padding-top:9px;
  border-top:1px dashed var(--border);font-size:11.5px;color:var(--text-muted)}
.ck-legend span{display:flex;align-items:center;gap:5px}
.ck-legend .lg{width:13px;height:13px;border-radius:4px;display:inline-block;border:1px solid transparent}
.ck-legend .lg.done{background:var(--green-light);border-color:#a7e0b8}
.ck-legend .lg.makeup{background:var(--orange-light);border-color:#f2cfa2}
.ck-legend .lg.miss{background:var(--red);border-color:var(--red)}
.ck-legend .lg.off{background:var(--surface-alt);border-color:var(--border)}
.ck-legend .lg.na{background:transparent;border-color:var(--border)}
.ck-attend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--border)}

.ck-att-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.ck-att-btn:hover{border-color:var(--accent);color:var(--accent)}
.ck-att-btn.class{background:#eafaf0;border-color:#a7e0b8;color:#1f8a4c}
.ck-att-btn.rest{background:#fff4e8;border-color:#f2cfa2;color:#b9742a}
.ck-att-hint{font-size:11px;color:var(--text-muted);margin-left:auto}
/* 日常反馈：休息日提示与表格内标识 */
.rest-banner{margin-top:10px;padding:9px 12px;border-radius:10px;background:#fff4e8;border:1px solid #f2cfa2;
  color:#b9742a;font-size:12.5px;font-weight:600}
.rest-pill{display:inline-block;padding:3px 12px;border-radius:20px;background:#fff4e8;border:1px solid #f2cfa2;
  color:#b9742a;font-size:13px;font-weight:800}
.rest-row{background:#fffaf3}
.rest-row td{opacity:.96}
.sc-rest-tag{display:inline-block;margin-left:4px;padding:0 5px;border-radius:6px;background:#f2cfa2;color:#fff;font-size:10px;font-weight:800}
.sc-rest{opacity:.72}
.att-opt{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.15s}
.att-opt:hover{border-color:var(--accent);background:var(--surface-alt)}
.att-opt-t{font-size:14px;font-weight:800;color:var(--text)}
.att-opt-d{font-size:11.5px;color:var(--text-muted);margin-top:3px}
.ck-quick{margin-bottom:10px}
.ck-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.ck-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:88px;
  border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:6px 11px;cursor:pointer;transition:.15s}
.ck-chip .ck-nm{font-size:13px;font-weight:800;color:var(--text)}
.ck-chip .ck-tag{font-size:10.5px;font-weight:700;opacity:.9}
.ck-chip:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.08)}
.ck-chip.ck-done{background:var(--green-light);border-color:#a7e0b8}
.ck-chip.ck-done .ck-tag{color:var(--green)}
.ck-chip.ck-makeup{background:var(--orange-light);border-color:#f2cfa2}
.ck-chip.ck-makeup .ck-tag{color:var(--orange)}
.ck-chip.ck-miss{background:var(--red);border-color:var(--red);box-shadow:0 0 0 2px rgba(220,38,38,.18)}
.ck-chip.ck-miss .ck-nm,.ck-chip.ck-miss .ck-tag{color:#fff}
.ck-chip.ck-off,.ck-chip.ck-na{background:var(--surface-alt);opacity:.7}
.ck-chip.ck-off .ck-tag,.ck-chip.ck-na .ck-tag{color:var(--text-muted)}
.ck-tip{margin-top:9px;font-size:11.5px;color:var(--text-muted)}
.ck-actions{display:flex;flex-direction:column;gap:8px}
.ck-sec{margin-top:14px}
.ck-sec-t{font-size:12.5px;font-weight:800;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.ck-m-row{display:flex;gap:8px;flex-wrap:wrap}
.ck-m-btn{flex:1;min-width:96px;border:1.5px solid var(--border);background:var(--surface);
  border-radius:9px;padding:9px 6px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text);transition:.15s}
.ck-m-btn:hover{transform:translateY(-1px)}
.ck-m-btn.on.m-green{background:var(--green-light);border-color:var(--green);color:var(--green)}
.ck-m-btn.on.m-yellow{background:#fff7df;border-color:#e3c552;color:#9a7b09}
.ck-m-btn.on.m-red{background:var(--red-light);border-color:var(--red);color:var(--red)}
.ck-note{width:100%;min-height:64px;border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;font-size:13px;font-family:inherit;resize:vertical;background:var(--surface-alt);color:var(--text)}
.ck-file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:4px}
.ck-file{border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface);text-align:center}
.ck-file-thumb{height:78px;border-radius:7px;overflow:hidden;cursor:pointer;background:var(--surface-alt)}
.ck-file-thumb img{width:100%;height:100%;object-fit:cover}
.ck-file-ico{height:78px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;background:var(--surface-alt)}
.ck-file-name{font-size:11px;margin:6px 0 4px;color:var(--text);word-break:break-all;line-height:1.3;max-height:30px;overflow:hidden}
.ck-file-acts{display:flex;gap:5px;justify-content:center}
.ck-doc-card{margin-top:14px;border:1px dashed var(--border);border-radius:11px;padding:12px;background:var(--surface-alt)}
.ck-doc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.ck-doc-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:8px;background:var(--surface)}
.ck-doc-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;cursor:pointer;flex:0 0 auto;background:var(--surface-alt)}
.ck-doc-ico{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;flex:0 0 auto;background:var(--surface-alt)}
.ck-doc-info{flex:1;min-width:0}
.ck-doc-name{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-doc-meta{font-size:11px;color:var(--text-muted)}
.ck-td{position:relative}
.ck-m-badge{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;display:inline-block}
.ck-m-badge.m-master{background:var(--green)}
.ck-m-badge.m-partial{background:#e3c552}
.ck-m-badge.m-unknown{background:var(--red)}
.mini{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--text);transition:.15s}
.mini:hover{background:var(--surface-alt)}
.mini.danger{color:var(--red);border-color:#f0c0c0}
.ck-cur{background:var(--surface-alt);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.ck-acts{display:flex;flex-direction:column;gap:8px}
.ck-act{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:10px 14px;
  font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;color:var(--text);transition:.15s}
.ck-act.done:hover{background:var(--green-light);border-color:#a7e0b8;color:var(--green)}
.ck-act.makeup:hover{background:var(--orange-light);border-color:#f2cfa2;color:var(--orange)}
.ck-act.miss:hover{background:var(--red-light);border-color:#f0b6b6;color:var(--red)}
.ck-tablewrap{overflow:auto;padding:0}
.ck-table{border-collapse:separate;border-spacing:0;font-size:12px}
.ck-table th,.ck-table td{border-bottom:1px solid var(--border);text-align:center}
.ck-table th.ck-name,.ck-table td.ck-name{position:sticky;left:0;z-index:4;background:var(--surface);
  text-align:left;min-width:76px;max-width:96px;padding:7px 10px;font-weight:800;font-size:12.5px;
  border-right:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-table th.ck-name{background:var(--surface-alt);z-index:6}
.ck-th{padding:5px 2px;min-width:31px;cursor:pointer;user-select:none;line-height:1.25}
.ck-th .ck-dd{font-size:12px;font-weight:800;color:var(--text-secondary)}
.ck-th .ck-wd{font-size:9.5px;font-weight:700;opacity:.65}
.ck-th:hover{background:var(--accent-soft,#eff6ff)}
.ck-th.today{background:var(--accent-soft,#eff6ff);box-shadow:inset 0 -2px 0 var(--accent,#2563eb)}
.ck-th.off .ck-wd{color:var(--orange)}
.ck-td{padding:0;height:30px;min-width:31px;cursor:pointer;position:relative;transition:.12s}
.ck-td .ck-sym{font-size:12.5px;font-weight:800;line-height:1}
.ck-td .ck-at{position:absolute;left:0;right:0;bottom:1px;font-style:normal;font-size:8px;font-weight:700;opacity:.85}
.ck-td:hover{outline:2px solid var(--accent,#2563eb);outline-offset:-2px;z-index:2}
.ck-td.ck-done{background:var(--green-light);color:var(--green)}
.ck-td.ck-makeup{background:var(--orange-light);color:var(--orange);padding-bottom:8px}
.ck-td.ck-miss{background:var(--red);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.ck-td.ck-off{background:var(--surface-alt);color:var(--text-muted)}
.ck-td.ck-na{color:var(--text-muted);opacity:.45}
.ck-td.ck-future{background:transparent}
.ck-table td.ck-rate,.ck-table th.ck-rate{position:sticky;right:0;z-index:4;background:var(--surface);
  min-width:74px;padding:5px 8px;border-left:1px solid var(--border);line-height:1.3}
.ck-table th.ck-rate{background:var(--surface-alt);z-index:6}
.ck-table td.ck-rate b{font-size:13px;font-weight:800;display:block}
.ck-table td.ck-rate i{font-style:normal;font-size:9.5px;color:var(--text-muted);font-weight:700}

/* ============ TABLES ============ */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:var(--surface-alt);color:var(--text-secondary);font-size:11.5px;font-weight:800;letter-spacing:.4px;
  padding:10px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:3}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:#fcfaff}
tbody tr:last-child td{border-bottom:none}
tfoot td{background:var(--surface-alt);font-weight:800;font-size:12.5px;border-top:2px solid var(--border);border-bottom:none;color:var(--text-secondary)}
.c{text-align:center}
.nm{font-weight:700}
/* 考试成绩表：按内容自适应、完全显示、整体居中 */
.exam-tbl{width:auto;min-width:max-content;table-layout:auto}
.exam-tbl th,.exam-tbl td{white-space:nowrap;text-align:center;padding:5px 8px}
.exam-tbl .cell-in{
  width:auto;min-width:3.5ch;max-width:11ch;
  field-sizing:content;
  text-align:center;padding:3px 5px;font-size:12.5px;
  transition:border-color .15s,background .15s;
}
.exam-tbl td.zk-school .cell-in{max-width:none;min-width:6ch}

/* 成绩分析区 */
.exam-ana{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.ana-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.ana-title{font-weight:800;font-size:15px;color:var(--text)}
.ana-empty{padding:18px;color:var(--text-muted);text-align:center;background:var(--surface-alt);border-radius:10px}
.ana-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.ana-tbl th,.ana-tbl td{padding:7px 10px;border-bottom:1px solid var(--border)}
.ana-tbl th{background:var(--surface-alt);font-weight:700;color:var(--text);text-align:left}
.ana-tbl td.c,.ana-tbl th.c{text-align:center}
.ana-tbl .rank-no{font-weight:800;color:var(--accent-dark)}
.ana-tbl tr.hot{background:rgba(22,163,74,.08)}
.ana-tbl tr.cold{background:rgba(220,38,38,.07)}
.up{color:#16a34a;font-weight:700}
.down{color:#dc2626;font-weight:700}
.flat{color:var(--text-muted)}
.ana-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ana-tools label{font-size:13px;color:var(--text-muted)}
.ana-legend{display:flex;gap:18px;margin-bottom:8px;font-size:13px;color:var(--text-muted)}
.ana-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ana-note{font-size:13px;color:var(--text-muted);margin-bottom:8px}
.seg-toggle.sm .seg-btn{padding:4px 10px;font-size:12px}
.exam-nm{font-weight:800;font-size:13.5px;color:var(--text);text-align:center;white-space:nowrap}
.exam-nm-arch{font-weight:700;color:var(--text-muted)}
.exam-arch-tag{display:inline-block;margin-left:4px;font-style:normal;font-size:10px;font-weight:800;line-height:1.4;
  padding:1px 5px;border-radius:6px;background:var(--surface-alt);color:var(--text-muted);vertical-align:middle}

.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;
  font-size:12px;font-weight:800;background:var(--surface-alt);color:var(--text-muted)}
.rank-badge.r1{background:linear-gradient(135deg,#ffd86b,#f5a623);color:#7a4d00}
.rank-badge.r2{background:linear-gradient(135deg,#e2e8f0,#b6c0cd);color:#3d4756}
.rank-badge.r3{background:linear-gradient(135deg,#f0b98a,#d98d52);color:#653409}

.att-group{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.att-group button{padding:4px 8px;font-size:11.5px;font-weight:700;color:var(--text-muted);background:var(--surface-alt);border-right:1px solid var(--border)}
.att-group button:last-child{border-right:none}
.att-group button.on-present{background:var(--green-light);color:var(--green)}
.att-group button.on-late{background:var(--yellow-light);color:var(--yellow)}
.att-group button.on-leave{background:var(--red-light);color:var(--red)}

.pts-chip{display:inline-block;background:var(--accent-light);color:var(--accent-dark);border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:800;min-width:36px;text-align:center}

.score-in{width:56px;text-align:center;border:1.5px solid var(--border);border-radius:9px;padding:5px 4px;font-size:13.5px;font-weight:800;background:#fff}
.rate-in{width:48px;text-align:center;border:1.5px solid var(--border);border-radius:9px;padding:5px 4px;font-size:13px;font-weight:700;background:#fff;color:var(--accent-dark)}
.score-in:focus{border-color:var(--accent)}
.score-in.s-g{background:var(--green-light);border-color:#a7e0b8;color:var(--green)}
.score-in.s-y{background:var(--yellow-light);border-color:#e8d98a;color:var(--yellow)}
.score-in.s-r{background:var(--red-light);border-color:#f0b6b6;color:var(--red)}
.hw-done-group{display:inline-flex;gap:4px}
.hw-btn{width:30px;height:30px;border:1.5px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:800;color:var(--text-muted);transition:.15s}
.hw-btn:hover{border-color:var(--accent)}
.hw-btn.on{background:var(--green-light);border-color:#a7e0b8;color:var(--green)}
.hw-btn.on-miss{background:var(--red-light);border-color:#f0b6b6;color:var(--red)}
.avg-val{font-weight:800;font-size:14px}
.v-g{color:var(--green)}.v-y{color:var(--yellow)}.v-r{color:var(--red)}

.multi-btn{min-width:120px;max-width:210px;text-align:left;border:1px dashed var(--border-strong);border-radius:9px;
  padding:5px 8px;background:var(--surface-alt);font-size:11.5px;color:var(--text-muted);line-height:1.5}
.multi-btn:hover{border-color:var(--accent);background:var(--accent-light)}
.chip{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin:1px 2px 1px 0}
.chip.positive{background:var(--green-light);color:var(--green)}
.chip.negative{background:var(--red-light);color:var(--red)}
.chip.neutral{background:var(--yellow-light);color:var(--yellow)}

.multi-panel{position:fixed;z-index:900;background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius);

.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}

.icon-btn{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;

.cell-in{width:100%;border:1px solid transparent;border-radius:7px;padding:5px 7px;background:transparent;font-size:12.5px}
.cell-in:hover{background:var(--surface-alt);border-color:var(--border)}
.cell-in:focus{background:#fff;border-color:var(--accent)}

/* trend */

.avg-card .ac-v{font-size:26px;font-weight:800;margin-top:2px}

/* === 测试分析控件 === */
.ta-label{font-size:12.5px;font-weight:700;color:var(--text-muted)}
.ta-seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.ta-seg button{border:none;background:var(--input-bg);color:var(--text-muted);font-size:12px;font-weight:700;padding:5px 11px;cursor:pointer}
.ta-seg button.on{background:var(--accent);color:#fff}
.ta-pass{width:64px;padding:5px 8px;font-size:13px}

/* mistake */
.split{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}
.side-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;max-height:calc(100vh - 220px);overflow-y:auto}
.sl-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;
  font-size:13px;font-weight:600;transition:.14s;width:100%;text-align:left}
.sl-item:hover{background:var(--surface-alt)}
.sl-item.active{background:var(--accent-light);color:var(--accent-dark);font-weight:800}
.badge{background:var(--red-light);color:var(--red);border-radius:999px;padding:1px 7px;font-size:11px;font-weight:800}
.badge.zero{background:var(--green-light);color:var(--green)}
.mk-card{border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:9px;background:var(--surface-alt)}
.mk-card.done{opacity:.62}
.mk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.mk-q{font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mk-r{font-size:12px;color:var(--text-muted);margin-top:5px;line-height:1.55}
.pill{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800}
.pill.type{background:var(--accent-light);color:var(--accent-dark)}
.pill.wait{background:var(--orange-light);color:var(--orange)}
.pill.ok{background:var(--green-light);color:var(--green)}
.practice-box{border:2px solid var(--accent);border-radius:var(--radius);padding:13px 15px;margin-bottom:14px;background:#f7fbff}
.pr-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.pr-item:last-child{border-bottom:none}
.pr-item input{margin-top:3px;accent-color:var(--accent);cursor:pointer}
.pr-item.done .pr-q{text-decoration:line-through;color:var(--text-muted)}

/* files grid */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.16s}
.fcard:hover{box-shadow:0 8px 22px rgba(40,85,165,.12);transform:translateY(-2px)}
.fcard .thumb{height:140px;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden}
.fcard .thumb img{width:100%;height:100%;object-fit:cover}
.fcard .fbody{padding:10px 12px}
.fcard .ftitle{font-size:13px;font-weight:700;line-height:1.4;word-break:break-word}
.fcard .fmeta{font-size:11px;color:var(--text-muted);margin-top:4px}
.fcard .factions{display:flex;gap:6px;margin-top:9px}
.frow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:11px 14px;margin-bottom:9px}
.frow .fico{width:42px;height:42px;border-radius:11px;background:var(--accent-light);display:flex;
  align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
.frow-thumb{width:48px;height:48px;border-radius:11px;background:var(--surface-alt);overflow:hidden;flex:0 0 auto;cursor:zoom-in;display:flex;align-items:center;justify-content:center}
.frow-thumb img{width:100%;height:100%;object-fit:cover}
.file-tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-right:7px;vertical-align:middle}
.file-tag.gl{background:#eef5ff;color:#2563eb;border:1px solid #c4d8f5}
.file-tag.pp{background:#fff8e6;color:#b8860b;border:1px solid #f3dfa2}
.upload-type{display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.upload-opt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer}
.upload-opt input{width:auto}

/* rank */
.type-toggle{display:flex;gap:7px;flex-wrap:wrap}
.tg{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
  font-size:12.5px;font-weight:700;color:var(--text-secondary);transition:.15s}
.tg:hover{border-color:var(--accent)}
.tg.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sel{border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:var(--surface);font-size:12.5px;font-weight:600}
.pf-sel{border:1px solid var(--border);border-radius:8px;padding:5px 8px;background:var(--surface);font-size:12.5px;font-weight:600;width:100%;max-width:170px;cursor:pointer}
.pf-sel:focus{outline:2px solid var(--accent-light)}
.medal{font-size:16px}
tr.nodata{opacity:.45}

/* ============ 出勤统计 ============ */
.att-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px}
.att-toolbar .tl{font-size:11.5px;font-weight:800;color:var(--text-muted);letter-spacing:.4px}
.att-toolbar input[type=date]{padding:6px 9px;font-size:12.5px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:#fff;color:var(--text);font-weight:700;font-family:inherit}
.att-sep{width:1px;height:22px;background:var(--border);margin:0 2px}

/* 汇总条 */
.att-sum{display:flex;align-items:stretch;gap:11px;flex-wrap:wrap;margin-bottom:14px}
.att-total{flex:1 1 300px;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:var(--radius);
  background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;box-shadow:0 8px 22px rgba(29,78,216,.24);
  position:relative;overflow:hidden}
.att-total::after{content:"";position:absolute;right:-26px;top:-26px;width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.12)}
.att-total .at-lbl{font-size:12.5px;font-weight:800;opacity:.92;line-height:1.5;position:relative;z-index:1}
.att-total .at-num{font-size:34px;font-weight:800;line-height:1;margin-left:auto;position:relative;z-index:1}
.att-total .at-unit{font-size:13px;font-weight:800;opacity:.9;align-self:flex-end;margin-bottom:3px;position:relative;z-index:1}
.att-cnt{flex:0 1 132px;min-width:118px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:11px 14px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.att-cnt .ac-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--border-strong)}
.att-cnt .ac-l{font-size:11.5px;font-weight:800;color:var(--text-muted)}
.att-cnt .ac-v{font-size:23px;font-weight:800;line-height:1.25}
.att-cnt .ac-v small{font-size:12px;font-weight:700;margin-left:2px}
.att-rest-note{color:#ca8a04;font-weight:800;white-space:nowrap}
.att-rest-cell{background:#fff8ef;text-align:center}
.att-rest-pill{display:inline-block;padding:2px 9px;border-radius:14px;background:#fff4e8;border:1px solid #f2cfa2;
  color:#b4791f;font-size:11px;font-weight:800}

/* 出勤表 */
.att-scroll{max-height:calc(100vh - 350px);overflow:auto;border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:0 1px 3px rgba(12,35,80,.05)}
.att-tbl{min-width:100%;border-collapse:separate;border-spacing:0}
.att-tbl th,.att-tbl td{white-space:nowrap;padding:7px 10px;border-bottom:1px solid var(--border)}
/* 表头吸顶 */
.att-tbl thead th{position:sticky;top:0;z-index:5;background:var(--surface-alt);
  border-bottom:2px solid var(--border-strong);box-shadow:0 1px 0 var(--border)}
.att-tbl thead th.atc-name,.att-tbl thead th.atc-cls{z-index:6}
/* 冻结首两列（学生 + 班级） */
.atc-name{position:sticky;left:0;z-index:3;background:var(--surface);font-weight:800;
  min-width:100px;box-shadow:2px 0 5px -2px rgba(12,35,80,.22)}
.atc-cls{position:sticky;left:100px;z-index:3;min-width:88px;font-size:12px;color:var(--text-secondary);font-weight:700;
  background:var(--surface);box-shadow:2px 0 5px -2px rgba(12,35,80,.22)}
tbody .atc-name,tbody .atc-cls{background:var(--surface)}
.atc-sum{background:var(--accent-light)!important;color:var(--accent-dark);font-weight:800;font-size:14px;min-width:64px;text-align:center}
.atc-n{min-width:52px;text-align:center;font-weight:800;font-size:13px}
.atc-rate{min-width:84px;text-align:center;font-weight:800;font-size:13px}
.rate-wrap{height:6px;border-radius:4px;background:var(--surface-alt);overflow:hidden;margin-bottom:3px}
.rate-bar{height:100%;border-radius:4px;transition:width .3s}
.atc-d{min-width:104px;width:104px;text-align:center;vertical-align:middle}
th.atc-d{font-size:12px;font-weight:800;color:var(--text-secondary)}
th.atc-d small{display:block;font-size:9.5px;font-weight:700;color:var(--text-muted);letter-spacing:.5px}
th.atc-d.we-sat small{color:#2563eb}
th.atc-d.we-sun small{color:var(--red)}
/* 周末浅底 + 今日高亮 */
.atc-d.we{background:#f2f7fe}
.atc-d.today{background:var(--accent-light)}
.atc-d.today .att-chip{box-shadow:0 0 0 2px var(--accent)}
/* 隔行浅纹（避开冻结列与周末/今日） */
.att-row:nth-child(even) td:not(.atc-name):not(.atc-cls):not(.we):not(.today){background:#f7fbff}
.att-row:hover td{background:var(--surface-alt)}
.att-row:hover td.atc-name,.att-row:hover td.atc-cls{background:#f3eefe}
.att-chip{display:inline-block;min-width:38px;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:800;
  border:1px solid transparent;cursor:pointer;transition:.12s;line-height:1.5}
.att-chip:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(30,70,150,.16)}
.ck-p{background:var(--green-light);color:var(--green);border-color:#bbf0c8;font-size:14px}
.ck-t{background:#fffbe8;color:#ca8a04;border-color:#f4e79a}
.ck-l{background:#fff5f5;color:#dc2626;border-color:#f8c6c6}
.ck-m{background:#fde68a;color:#1a202c;border-color:#e6c65c}
.ck-n{background:transparent;color:#c9c2da;border-color:transparent;font-size:15px}
.ck-n:hover{background:var(--surface-alt);color:var(--text-muted);transform:none;box-shadow:none}
.att-mkin{display:block;width:94px;margin:4px auto 0;padding:2px 4px;font-size:10px;font-family:inherit;
  border:1px dashed var(--border-strong);border-radius:6px;background:#fff;color:var(--text-secondary);cursor:pointer}
.att-mkin.done{border-style:solid;border-color:#e6c65c;background:#fffbeb;color:#7a5a05;font-weight:700}
.att-mkin:hover{border-color:var(--accent)}
/* 合计行吸底 */
.att-foot td{background:var(--surface-alt)!important;font-weight:800;font-size:12.5px;
  position:sticky;bottom:0;z-index:4;box-shadow:0 -1px 0 var(--border-strong),0 2px 5px -2px rgba(12,35,80,.2)}
.att-foot td.atc-name,.att-foot td.atc-cls{z-index:5;left:0;background:var(--surface-alt);
  box-shadow:2px 0 5px -2px rgba(12,35,80,.22),0 -1px 0 var(--border-strong)}
.att-foot td.atc-cls{left:100px}

/* 纸质出勤登记表附件画廊 */
.att-docs{margin:14px 0 4px;padding:13px 15px;background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius)}
.att-docs-t{font-size:13px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:7px;color:var(--text-secondary)}
.att-docs-t .muted{font-weight:600;margin-left:4px}
.att-docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
.att-doc{position:relative;background:#fff;border:1px solid var(--border);border-radius:11px;overflow:hidden;transition:.14s;box-shadow:0 1px 3px rgba(12,35,80,.05)}
.att-doc:hover{box-shadow:0 5px 16px rgba(30,70,150,.16);transform:translateY(-2px);border-color:var(--border-strong)}
.att-doc-img{display:block;width:100%;height:90px;border:none;background:#f1f5fb;cursor:pointer;padding:0;overflow:hidden}
.att-doc-img img{width:100%;height:100%;object-fit:cover;display:block}
.att-doc-ico{display:flex;align-items:center;justify-content:center;height:90px;font-size:30px}
.att-doc-meta{padding:7px 9px 9px}
.att-doc-title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-doc-sub{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:2px}
.att-doc-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,255,255,.92);color:var(--red);font-size:14px;font-weight:800;line-height:1;cursor:pointer;display:none}
.att-doc:hover .att-doc-del{display:block}

.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px dashed var(--border)}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--text-secondary)}
.lg-dot{width:12px;height:12px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.att-pop{width:246px}
.mk-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto}
.mk-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--yellow-light);
  border:1px solid #f4e79a;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;color:#8a5d03}
.mk-row .mk-arrow{color:#c99a10;font-weight:800}
.mk-row .mk-x{margin-left:auto;color:#b3781a;font-size:15px;line-height:1}
.mk-row .mk-x:hover{color:var(--red)}

/* modal —— 分层：底层业务面板 1000 / 抽奖·积分 1100 / 通用弹窗(含二级设置) 1400 / 中奖庆祝 1800 / toast 2000 */
.overlay{position:fixed;inset:0;background:rgba(10,30,70,.45);backdrop-filter:blur(3px);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:20px;animation:ovIn .18s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
#ldRoot .overlay,#psRoot .overlay{z-index:1100}
#ldsRoot .overlay{z-index:1300}
#modalRoot .overlay{z-index:1400}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(15,45,105,.3);
  animation:mdIn .2s cubic-bezier(.22,.9,.32,1);will-change:transform,opacity}
.modal.no-anim{animation:none}
@keyframes mdIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-head h3{font-size:16px;font-weight:800}
.mh-actions{display:flex;align-items:center;gap:9px}
.modal-body{padding:18px 20px;overflow-y:auto}
.modal-foot{padding:13px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--text-secondary);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:9px 11px;background:var(--surface-alt);font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:88px;resize:vertical;line-height:1.6}
.close-x{font-size:20px;color:var(--text-muted);line-height:1;padding:0 4px}
.close-x:hover{color:var(--red)}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:2000;
  background:#12305c;color:#fff;padding:11px 22px;border-radius:999px;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ LUCKY DRAW ============ */
.ld-panel{border-radius:var(--radius-lg);width:100%;max-width:1000px;max-height:93vh;overflow:hidden;
  display:grid;grid-template-columns:1fr 316px;box-shadow:0 30px 80px rgba(10,35,90,.45);
  animation:mdIn .26s cubic-bezier(.2,.9,.3,1.2)}
.ld-left{padding:20px 26px 22px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:13px;
  background:radial-gradient(120% 90% at 50% -10%,#1e3a8a 0%,#152e6e 45%,#0f2350 100%);color:#eaf2ff}
.ld-left::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
.ld-right{background:var(--surface-alt);padding:16px;overflow-y:auto}
/* 内嵌到积分统计面板下方的抽奖台（无遮罩、跟随滚动） */
.ld-embed{grid-template-columns:1fr 300px;max-width:100%;max-height:none;animation:none;overflow:visible;
  box-shadow:0 14px 40px rgba(10,35,90,.16);border:1px solid var(--border);margin:0}
.ld-embed .ld-left{max-height:none}
.ld-head{width:100%;display:flex;justify-content:space-between;align-items:center}
.ld-head h3{font-size:19px;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(92deg,#ffe9a8,#fff,#bfe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ld-head-actions{display:flex;gap:8px;align-items:center}
.ld-head .close-x{color:rgba(255,255,255,.66)}
.ld-head .close-x:hover{color:#fff}
.ld-gear{padding:6px 13px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);
  font-size:12px;font-weight:700;color:#dbeafe;transition:.16s}
.ld-gear:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5)}
.ld-controls{width:100%;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ld-controls .sel{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26);color:#fff}
.ld-controls .sel option{color:#12233d}
.mood-btn{padding:7px 13px;border-radius:999px;border:1.5px solid rgba(255,255,255,.28);font-size:12.5px;
  font-weight:700;color:#c9dcfa;transition:.16s}
.mood-btn:hover{background:rgba(255,255,255,.12)}
.mood-btn.on{background:#fff;color:var(--accent-dark);border-color:#fff}
.pts-show{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#4a2c00;border-radius:999px;
  padding:6px 16px;font-size:13px;font-weight:800;box-shadow:0 4px 12px rgba(245,158,11,.36)}

/* 转盘 */
.wheel-wrap{position:relative;width:340px;height:356px;display:flex;align-items:flex-end;justify-content:center}
.wheel-glow{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:330px;height:330px;border-radius:50%;
  background:radial-gradient(circle,rgba(96,165,250,.42),transparent 66%);filter:blur(12px);animation:glowPulse 2.6s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:.95;transform:translateX(-50%) scale(1.06)}}
.wheel-ring{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:322px;height:322px;border-radius:50%;
  background:conic-gradient(#fde68a,#fbbf24,#fff7cd,#f59e0b,#fde68a);
  box-shadow:0 14px 40px rgba(8,25,65,.55),inset 0 0 0 1px rgba(255,255,255,.5)}
.wheel-pins{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:322px;height:322px;
  border-radius:50%;pointer-events:none;z-index:3}
.wheel-pin{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;
  background:#fffdf2;box-shadow:0 0 6px 1px rgba(255,238,170,.95)}
.ld-spinning .wheel-pin{animation:pinBlink .55s linear infinite}
.wheel-pin:nth-child(2n){animation-delay:.27s}
@keyframes pinBlink{0%,100%{opacity:1;box-shadow:0 0 7px 2px rgba(255,236,150,1)}50%{opacity:.35;box-shadow:0 0 3px 0 rgba(255,236,150,.5)}}
.pointer{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:0;height:0;z-index:6;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #ef4444;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.5))}
.pointer::after{content:'';position:absolute;left:-9px;top:-31px;width:18px;height:18px;border-radius:50%;
  background:linear-gradient(160deg,#fff,#e2e8f0);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.pointer.knock{animation:knock .12s ease-in-out}
@keyframes knock{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(-13deg)}}
.wheel{width:296px;height:296px;border-radius:50%;position:relative;margin-bottom:13px;
  border:5px solid #fffdf5;box-shadow:0 0 0 3px rgba(255,255,255,.35),inset 0 0 26px rgba(6,20,50,.32);
  transition:transform 5.2s cubic-bezier(.11,.72,.16,1)}
.wheel-label{position:absolute;left:50%;top:50%;font-size:13px;line-height:1;transform-origin:0 0;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel-label .wl-ico{font-size:21px}
.wheel-label .wl-txt{font-size:9.5px;font-weight:800;color:#fff;white-space:nowrap;max-width:76px;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.wheel-hub{position:absolute;left:50%;top:calc(50% - 6.5px);transform:translate(-50%,-50%);width:66px;height:66px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e6eefb);
  box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 0 0 3px #fbbf24;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:var(--accent-dark);z-index:5;letter-spacing:.5px}
.ld-spinning .wheel-hub{animation:hubPulse .6s ease-in-out infinite}
@keyframes hubPulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.09)}}

.draw-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 52%,#ea8a04 100%);
  color:#43290a;padding:14px 46px;border-radius:999px;font-size:16.5px;font-weight:900;letter-spacing:.6px;
  box-shadow:0 10px 26px rgba(245,158,11,.46),inset 0 -3px 0 rgba(0,0,0,.13);transition:.16s}
.draw-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.6) 50%,transparent 62%);
  transform:translateX(-130%);animation:shine 2.7s ease-in-out infinite}
@keyframes shine{0%,62%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.draw-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 32px rgba(245,158,11,.6)}
.draw-btn:active:not(:disabled){transform:translateY(1px) scale(.985)}
.draw-btn:disabled{background:rgba(255,255,255,.16);color:rgba(255,255,255,.5);box-shadow:none;cursor:not-allowed}
.draw-btn:disabled::after{display:none}

.ld-result{width:100%;min-height:78px;border-radius:var(--radius);border:2px dashed rgba(255,255,255,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:13px;text-align:center;
  background:rgba(255,255,255,.06);transition:.24s}
.ld-result .muted{color:rgba(226,238,255,.62)}
.ld-result.win{border-style:solid;border-color:#fbbf24;background:linear-gradient(135deg,rgba(251,191,36,.2),rgba(255,255,255,.1));
  box-shadow:0 0 0 4px rgba(251,191,36,.14);animation:winPop .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes winPop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.ld-result .rr-ico{font-size:32px;animation:bounceIco .9s ease-in-out infinite}
@keyframes bounceIco{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ld-result .rr-t{font-size:18px;font-weight:900;color:#ffe9a8}
.ld-result .rr-d{font-size:12.5px;color:rgba(226,238,255,.8)}
.ld-left .hint{color:rgba(203,222,250,.72);border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
.uni-opts{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.uni-opts .btn{background:rgba(255,255,255,.92)}
.hist-item{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;margin-bottom:7px;font-size:12px;transition:.14s}
.hist-item:hover{border-color:var(--accent);transform:translateX(2px)}
.hist-item .hi-ico{font-size:16px}
.hist-item .hi-n{font-weight:800}
.hist-item .hi-t{color:var(--text-muted);font-size:10.5px;margin-top:2px}

/* 中奖庆祝层 */
#confettiRoot{position:fixed;inset:0;pointer-events:none;z-index:1750;overflow:hidden}
.cfti{position:absolute;top:-14px;width:9px;height:15px;opacity:.95;border-radius:2px;animation:cftiFall linear forwards}
@keyframes cftiFall{0%{transform:translateY(-10px) rotate(0);opacity:1}
  100%{transform:translateY(102vh) rotate(760deg);opacity:.15}}
.win-overlay{position:fixed;inset:0;z-index:1800;display:flex;align-items:center;justify-content:center;
  background:rgba(8,22,55,.58);backdrop-filter:blur(4px);animation:ovIn .2s}
.win-card{position:relative;width:min(390px,88vw);border-radius:26px;padding:30px 26px 22px;text-align:center;
  background:linear-gradient(165deg,#1e40af 0%,#1d4ed8 48%,#2563eb 100%);color:#fff;overflow:hidden;
  box-shadow:0 26px 70px rgba(5,18,52,.6),inset 0 0 0 2px rgba(255,255,255,.16);
  animation:winCardIn .5s cubic-bezier(.16,1.5,.4,1)}
@keyframes winCardIn{0%{transform:scale(.6) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
.win-card::before{content:'';position:absolute;top:-52%;left:-52%;width:204%;height:204%;
  background:conic-gradient(from 0deg,transparent 0 78%,rgba(255,255,255,.2) 84%,transparent 90% 100%);
  animation:rayspin 6.5s linear infinite}
@keyframes rayspin{to{transform:rotate(360deg)}}
.win-card>*{position:relative;z-index:1}
.win-tag{display:inline-block;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#4a2c00;font-size:11.5px;
  font-weight:900;letter-spacing:3px;padding:4px 15px;border-radius:999px;margin-bottom:14px}
.win-ico{font-size:74px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4));animation:winIco 1.5s ease-in-out infinite}
@keyframes winIco{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
.win-label{font-size:27px;font-weight:900;margin:12px 0 4px;letter-spacing:1px;
  background:linear-gradient(93deg,#fff5cf,#fff,#cfe6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.win-who{font-size:13.5px;font-weight:700;color:#bfdbfe}
.win-desc{font-size:12.5px;color:rgba(226,238,255,.86);margin-top:9px;line-height:1.65}
.win-extra{margin-top:11px;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  border-radius:12px;padding:8px 17px;font-size:14px;font-weight:800}
.win-uni{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.win-uni button{background:rgba(255,255,255,.94);color:var(--accent-deep);border-radius:11px;padding:9px 13px;
  font-size:12.5px;font-weight:800;transition:.14s}
.win-uni button:hover{transform:translateY(-2px);box-shadow:0 7px 16px rgba(0,0,0,.28)}
.win-ok{margin-top:17px;width:100%;background:#fff;color:var(--accent-dark);border-radius:999px;padding:11px;
  font-size:14.5px;font-weight:900;transition:.14s}
.win-ok:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(0,0,0,.3)}

/* 抽奖设置（独立宽面板） */
.lds-panel{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:860px;max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 72px rgba(10,35,90,.42);
  animation:mdIn .24s cubic-bezier(.2,.9,.3,1.2)}
.lds-body{overflow-y:auto;padding:16px 20px 20px}
.lds-cost{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;margin-bottom:14px;
  font-size:13px;font-weight:700;color:var(--text-secondary)}
.lds-tblwrap{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.lds-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.lds-tbl th{background:var(--surface-alt);padding:9px 8px;text-align:left;font-size:11px;font-weight:800;
  color:var(--text-secondary);letter-spacing:.5px;border-bottom:1.5px solid var(--border-strong);white-space:nowrap}
.lds-tbl td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
.lds-tbl tr:last-child td{border-bottom:none}
.lds-tbl tbody tr:hover{background:var(--accent-soft)}
.lds-tbl input[type=text],.lds-tbl input[type=number]{width:100%;border:1px solid var(--border);border-radius:8px;
  padding:7px 9px;background:var(--surface-alt);font-size:12.5px;transition:.14s}
.lds-tbl input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.lds-color{width:34px;height:34px;padding:0;border:1px solid var(--border-strong);border-radius:9px;background:none;cursor:pointer}
.lds-ico input{text-align:center;font-size:17px!important}
.lds-pctwrap{display:flex;flex-direction:column;gap:3px;min-width:84px}
.lds-pcttxt{font-size:11.5px;font-weight:900;color:var(--accent-dark)}
.lds-bar{height:6px;border-radius:999px;background:var(--border);overflow:hidden}
.lds-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .25s}
.lds-ops{display:flex;gap:3px;justify-content:flex-end}
.lds-ops .icon-btn{width:26px;height:26px;border-radius:7px;font-size:12px}
.lds-foot-tip{font-size:11.5px;color:var(--text-muted);margin-top:10px;line-height:1.7}
.lds-preview{display:flex;align-items:center;gap:14px;margin-top:14px;padding:12px 14px;border-radius:var(--radius-sm);
  background:var(--accent-soft);border:1px solid var(--border)}
.lds-mini{width:74px;height:74px;border-radius:50%;flex:0 0 auto;border:3px solid #fff;box-shadow:0 3px 10px rgba(15,45,105,.2)}

/* points stats */
.ps-panel{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:980px;max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(15,45,105,.35)}
.ps-body{overflow-y:auto;padding:18px 22px}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ps-sec{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.pts-edit{display:flex;flex-direction:column;gap:10px}
.pe-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--text-secondary);
  background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;transition:.14s}
.pe-row:hover{border-color:var(--border-strong);background:var(--accent-soft)}
.pe-lbl{background:var(--accent-light);color:var(--accent-dark);border-radius:8px;padding:5px 11px;
  min-width:104px;text-align:center;font-weight:800;font-size:12.5px;flex:0 0 auto}
.pe-row label{display:inline-flex;align-items:center;gap:4px}
.pe-in{width:62px;padding:6px 8px;font-size:13px;border:1.5px solid var(--border-strong);border-radius:8px;
  font-weight:800;text-align:center;background:#fff;transition:.14s}
.pe-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.pe-preview{margin-top:4px;padding:11px 13px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:9px;
  font-size:12.5px;font-weight:700;color:var(--accent-dark);line-height:1.6;word-break:break-word}
.pe-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pe-tab{padding:8px 13px;border:1.5px solid var(--border);background:#fff;border-radius:999px;font-size:12.5px;font-weight:700;
  color:var(--text-secondary);cursor:pointer;transition:.14s}
.pe-tab:hover{border-color:var(--accent);color:var(--accent)}
.pe-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pe-mod{display:flex;flex-direction:column;gap:10px}
.mod-bar{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--surface-alt);border:1px solid var(--border);margin-bottom:9px}
.mod-seg{height:100%;transition:width .3s}
.mod-legend{display:flex;flex-wrap:wrap;gap:14px}
.mod-lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-secondary)}
.mod-lg i{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.mod-lg b{color:var(--text);font-weight:800}
/* 表头设置按钮 / 可点击学生名 */
.th-gear{margin-left:5px;padding:1px 7px;border:1px solid var(--border);border-radius:7px;background:#fff;font-size:11px;color:var(--text-muted);cursor:pointer}
.th-gear:hover{border-color:var(--accent);color:var(--accent)}
.th-label{cursor:pointer;border-bottom:1px dashed transparent;transition:border-color .15s,color .15s}
.th-label:hover{border-bottom-color:var(--accent);color:var(--accent)}
.stu-link{border:none;background:none;padding:3px 6px;border-radius:7px;font-size:13.5px;font-weight:800;color:var(--text);cursor:pointer}
.stu-link:hover{background:var(--accent-light);color:var(--accent-dark);text-decoration:underline}
/* 标语编辑器 */
.tg-edit-list{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.tg-edit-row{display:flex;align-items:center;gap:8px}
.tg-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.tg-dot.positive{background:#16a34a}.tg-dot.neutral{background:#ca8a04}.tg-dot.negative{background:#dc2626}
.tg-edit-row .sel{flex:1;min-width:0}
/* 学生档案弹窗 */
.sc-head{display:flex;align-items:center;gap:14px;margin:-18px -20px 16px;padding:18px 20px;
  background:linear-gradient(135deg,#eaf1ff,#f7faff);border-bottom:1px solid var(--border);border-radius:14px 14px 0 0}
.sc-avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;flex:0 0 auto;
  box-shadow:0 6px 16px rgba(37,99,235,.35)}
.sc-name{font-size:20px;font-weight:800;color:var(--text)}
.sc-cls{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-top:3px}
.sc-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
@media(max-width:560px){.sc-stats{grid-template-columns:repeat(3,1fr)}}
.sc-stat{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 6px 9px;text-align:center;overflow:hidden}
.sc-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--accent))}
.sc-ico{font-size:15px;line-height:1;margin-bottom:3px}
.sc-v{font-size:20px;font-weight:800;line-height:1}
.sc-l{font-size:11px;font-weight:700;color:var(--text-muted);margin-top:4px}
.sc-sec{margin-bottom:14px;background:var(--surface-alt);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.sc-sec-t{font-size:13px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:7px;color:var(--text-secondary)}
.sc-sec-t::before{content:'';width:4px;height:14px;border-radius:3px;background:var(--accent)}
.sc-tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:9px;overflow:hidden}
.sc-tbl th{font-size:11.5px;color:var(--text-muted);font-weight:800;padding:7px 9px;background:#f1f5fb;border-bottom:1px solid var(--border);text-align:left}
.sc-tbl td{font-size:13px;padding:7px 9px;border-bottom:1px solid var(--border)}
.sc-tbl tbody tr:nth-child(even){background:#fafcff}
.sc-tbl tbody tr:last-child td{border-bottom:none}
.sc-tbl td.c,.sc-tbl th.c{text-align:center}
.sc-zk{font-size:12.5px;font-weight:700;color:var(--text-secondary);margin-top:7px}
.sc-profile{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc-pf{background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.sc-pf-l{font-size:11px;font-weight:800;color:var(--text-muted)}
.sc-pf-v{font-size:13.5px;font-weight:700;color:var(--text)}
.sc-actions{display:flex;gap:10px;margin-top:6px}
.sc-actions .btn{flex:1;justify-content:center}
.sc-ck-summary{font-size:12.5px;font-weight:600;color:var(--text-secondary);background:#fff;border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:9px}
.sc-ck-summary b{font-weight:800;color:var(--text)}
.sc-ck-summary b.ck-red{color:var(--red)}
.sc-ck-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.sc-ck-l{font-size:12px;font-weight:800;color:var(--text-muted);flex:0 0 auto}
.sc-ck-chip{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px}
.sc-ck-chip.miss{background:var(--red);color:#fff}
.sc-ck-chip.mk{background:var(--orange-light);color:var(--orange);border:1px solid #f2cfa2}
.sc-ck-actions{margin-top:2px}
.ps-sec h4{font-size:13.5px;font-weight:800;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.adj-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.op-btn{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;font-weight:700}
.op-btn.on-add{background:var(--green);color:#fff;border-color:var(--green)}
.op-btn.on-sub{background:var(--red);color:#fff;border-color:var(--red)}
.stu-pts{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;
  border:1px solid var(--border);border-radius:11px;padding:9px 12px;margin-bottom:7px}
.sp-name{font-size:13px;font-weight:800}
.sp-cls{font-size:11px;color:var(--text-muted);font-weight:600}
.sp-src{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.src-tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px}
.src-tag.plus{background:var(--green-light);color:var(--green)}
.src-tag.minus{background:var(--red-light);color:var(--red)}
.amt-chips{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
.amt-chip{padding:5px 11px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:800;color:var(--text-secondary);cursor:pointer;transition:.12s}
.amt-chip:hover{border-color:var(--accent);color:var(--accent)}
.amt-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sp-rank{display:inline-block;min-width:22px;text-align:center;font-size:13px;font-weight:800;color:var(--text-muted);margin-right:4px}
.sp-name.stu-link{font-size:13px}
.sp-bar{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--surface-alt);margin-top:6px;gap:1px}
.sp-bar span{height:100%;transition:width .3s}
.stu-pts:hover{box-shadow:0 3px 12px rgba(30,70,150,.1);border-color:var(--border-strong)}
/* 学生积分卡片网格：一屏看全所有学生 */
.ps-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px}
.ps-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px 14px;cursor:pointer;
  transition:.14s;box-shadow:0 2px 8px rgba(30,70,150,.06);position:relative;overflow:hidden}
.ps-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(30,70,150,.16);border-color:var(--accent)}
.ps-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),var(--accent-dark))}
.psc-top{display:flex;align-items:center;gap:9px}
.psc-rank{font-size:15px;font-weight:900;min-width:24px;text-align:center}
.psc-info{flex:1;min-width:0}
.psc-name{font-size:14.5px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psc-cls{font-size:11px;color:var(--text-muted);font-weight:600}
.psc-total{font-size:20px;font-weight:900;color:var(--accent-dark);line-height:1}
.psc-total i{font-size:11px;font-weight:700;font-style:normal;color:var(--text-muted);margin-left:1px}
.psc-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--surface-alt);margin:10px 0 11px;gap:1px}
.psc-bar span{height:100%;transition:width .3s}
.psc-acts{display:flex;gap:7px}
.psc-add{flex:1;border:1.5px solid var(--green);background:var(--green-light);color:var(--green);border-radius:9px;
  padding:6px 0;font-size:12px;font-weight:800;cursor:pointer;transition:.12s}
.psc-add:hover{background:var(--green);color:#fff}

<script>
/* eslint-disable */
/* ==================================================================

   ================================================================== */
const STORAGE_KEY = 'teach_workbench_v12';
const DB_NAME = 'workbench_files';
const DB_STORE = 'files';

const TOPIC_OPTS = [

const EXAM_PERIODS = ['七上期中','七上期末','七下期中','七下期末','八上期中','八上期末','八下期中','八下期末','九上期中','九上期末','九下期中'];
