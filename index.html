/* ==================================================================
   考试成绩 · 成绩分析（表格下方）
   ================================================================== */
function lastExamPeriod(cls){
  const list = examStudentList(cls);
  for (let i = EXAM_PERIODS.length - 1; i >= 0; i--){
    const p = EXAM_PERIODS[i];
    if (list.some(s => { const d = (cls.examScores[s.id] || {})[p] || {}; return num(d.mathScore) != null || num(d.totalScore) != null; })) return p;
  }
  return EXAM_PERIODS[0];
}
function examPeriodStats(cls, period){
  const list = examStudentList(cls);
  const mathVals = [], totalVals = [];
  list.forEach(s => {
    const d = (cls.examScores[s.id] || {})[period] || {};
    const m = num(d.mathScore), t = num(d.totalScore);
    if (m != null) mathVals.push(m);
    if (t != null) totalVals.push(t);
  });
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10 : null;
  const mx = a => a.length ? Math.max.apply(null, a) : null;
  const mn = a => a.length ? Math.min.apply(null, a) : null;
  const pass = a => a.length ? Math.round(a.filter(v => v >= 60).length / a.length * 100) : 0;
  return {
    count: mathVals.length || totalVals.length,
    mathAvg: avg(mathVals), mathMax: mx(mathVals), mathMin: mn(mathVals), mathPass: pass(mathVals),
    totalAvg: avg(totalVals), totalMax: mx(totalVals), totalMin: mn(totalVals),
  };
}
function examRankList(cls, period, by){
  by = by || 'total';
  const list = examStudentList(cls);
  const arr = list.map(s => {
    const d = (cls.examScores[s.id] || {})[period] || {};
    return { sid: s.id, name: s.name, math: num(d.mathScore), total: num(d.totalScore) };
  }).filter(r => by === 'math' ? r.math != null : r.total != null);
  arr.sort((a, b) => by === 'math' ? (b.math - a.math) : (b.total - a.total));
  return arr;
}
function examProgress(cls){
  const list = examStudentList(cls);
  const valid = EXAM_PERIODS.filter(p => list.some(s => {
    const d = (cls.examScores[s.id] || {})[p] || {};
    return num(d.mathScore) != null || num(d.totalScore) != null;
  }));
  if (valid.length < 2) return { periods: valid, rows: [] };
  const p1 = valid[valid.length - 2], p2 = valid[valid.length - 1];
  const rows = list.map(s => {
    const d1 = (cls.examScores[s.id] || {})[p1] || {}, d2 = (cls.examScores[s.id] || {})[p2] || {};
    const m1 = num(d1.mathScore), m2 = num(d2.mathScore), t1 = num(d1.totalScore), t2 = num(d2.totalScore);
    let md = null, td = null;
    if (m1 != null && m2 != null) md = Math.round((m2 - m1) * 10) / 10;
    if (t1 != null && t2 != null) td = Math.round((t2 - t1) * 10) / 10;
    return { sid: s.id, name: s.name, mathDelta: md, totalDelta: td };
  }).filter(r => r.mathDelta != null || r.totalDelta != null);
  return { periods: [p1, p2], rows };
}
function examAnaSummary(cls){
  const rows = EXAM_PERIODS.map(p => {
    const st = examPeriodStats(cls, p);
    if (!st.count) return null;
    return `<tr>
      <td class="c">${esc(p)}</td>
      <td class="c">${st.count}</td>
      <td class="c">${st.mathAvg == null ? '—' : st.mathAvg}</td>
      <td class="c">${st.mathMax == null ? '—' : st.mathMax}</td>
      <td class="c">${st.mathMin == null ? '—' : st.mathMin}</td>
      <td class="c">${st.mathPass}%</td>
      <td class="c">${st.totalAvg == null ? '—' : st.totalAvg}</td>
      <td class="c">${st.totalMax == null ? '—' : st.totalMax}</td>
      <td class="c">${st.totalMin == null ? '—' : st.totalMin}</td>
    </tr>`;
  }).filter(Boolean).join('');
  if (!rows) return '<div class="ana-empty">暂无考试成绩数据，先在上方表格录入成绩。</div>';
  return `<table class="ana-tbl"><thead><tr>
    <th>期次</th><th>参考人数</th><th>数学均分</th><th>数学最高</th><th>数学最低</th><th>数学及格率</th>
    <th>总分均分</th><th>总分最高</th><th>总分最低</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}
function examAnaTrend(cls){
  const periods = EXAM_PERIODS.filter(p => examPeriodStats(cls, p).count);
  if (!periods.length) return '<div class="ana-empty">暂无数据可绘制趋势。</div>';
  const mathPts = periods.map(p => ({ label: p, val: examPeriodStats(cls, p).mathAvg }));
  const totalPts = periods.map(p => ({ label: p, val: examPeriodStats(cls, p).totalAvg }));
  const series = [
    { name: '数学均分', color: '#2563eb', points: mathPts },
    { name: '总分均分', color: '#f59e0b', points: totalPts },
  ];
  const legend = `<div class="ana-legend"><span><i style="background:#2563eb"></i>数学均分</span><span><i style="background:#f59e0b"></i>总分均分</span></div>`;
  return legend + svgLineChart(series, { xLabels: periods.map(esc), height: 300 });
}
function examAnaRank(cls, period, by){
  by = by || 'total';
  const list = examRankList(cls, period, by);
  if (!list.length) return `<div class="ana-empty">「${esc(period)}」暂无${by === 'math' ? '数学' : '总分'}成绩。</div>`;
  const opts = EXAM_PERIODS.map(p => `<option ${p === period ? 'selected' : ''}>${esc(p)}</option>`).join('');
  const byBtns = `<div class="seg-toggle sm">
    <button class="seg-btn ${by === 'total' ? 'on' : ''}" onclick="setExamAnaBy('total')">按总分</button>
    <button class="seg-btn ${by === 'math' ? 'on' : ''}" onclick="setExamAnaBy('math')">按数学</button></div>`;
  const rows = list.map((r, i) => `<tr>
    <td class="c rank-no">${i + 1}</td>
    <td>${esc(r.name)}</td>
    <td class="c">${r.math == null ? '—' : r.math}</td>
    <td class="c">${r.total == null ? '—' : r.total}</td></tr>`).join('');
  return `<div class="ana-tools"><label>期次</label>
    <select class="sel" onchange="setExamAnaPeriod(this.value)">${opts}</select>${byBtns}</div>
    <table class="ana-tbl"><thead><tr><th>名次</th><th>姓名</th><th>数学</th><th>总分</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function examAnaProgress(cls){
  const pg = examProgress(cls);
  if (pg.periods.length < 2) return '<div class="ana-empty">至少需要两期成绩才能对比进步情况。</div>';
  const [p1, p2] = pg.periods;
  const sorted = pg.rows.slice().sort((a, b) => {
    const da = (b.totalDelta == null ? -1e9 : b.totalDelta) - (a.totalDelta == null ? -1e9 : a.totalDelta);
    if (da) return da;
    return (b.mathDelta == null ? -1e9 : b.mathDelta) - (a.mathDelta == null ? -1e9 : a.mathDelta);
  });
  const cell = d => d == null ? '—' : `<span class="${(d > 0 ? 'up' : d < 0 ? 'down' : 'flat')}">${(d > 0 ? '+' : '') + d}</span>`;
  const rows = sorted.map((r, i) => `<tr class="${i < 3 ? 'hot' : (i >= sorted.length - 3 ? 'cold' : '')}">
    <td>${esc(r.name)}</td>
    <td class="c">${cell(r.mathDelta)}</td>
    <td class="c">${cell(r.totalDelta)}</td></tr>`).join('');
  return `<div class="ana-note">对比期次：<b>${esc(p1)}</b> → <b>${esc(p2)}</b>（按总分变化排序，前 3 名进步、后 3 名需关注）</div>
    <table class="ana-tbl"><thead><tr><th>姓名</th><th>数学变化</th><th>总分变化</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function examAnaHtml(cls){
  const hasUi = (typeof ui !== 'undefined' && ui);
  const tab = hasUi && ui.examAnaTab ? ui.examAnaTab : 'summary';
  const period = hasUi && ui.examAnaPeriod ? ui.examAnaPeriod : lastExamPeriod(cls);
  const by = hasUi && ui.examAnaBy ? ui.examAnaBy : 'total';
  let body;
  if (tab === 'summary') body = examAnaSummary(cls);
  else if (tab === 'trend') body = examAnaTrend(cls);
  else if (tab === 'rank') body = examAnaRank(cls, period, by);
  else body = examAnaProgress(cls);
  return `<div id="examAnaRoot" class="exam-ana">
    <div class="ana-head">
      <span class="ana-title">📊 成绩分析</span>
      <div class="seg-toggle">
        <button class="seg-btn ${tab === 'summary' ? 'on' : ''}" onclick="setExamAnaTab('summary')">班级汇总</button>
        <button class="seg-btn ${tab === 'trend' ? 'on' : ''}" onclick="setExamAnaTab('trend')">均分趋势</button>
        <button class="seg-btn ${tab === 'rank' ? 'on' : ''}" onclick="setExamAnaTab('rank')">学生排名</button>
        <button class="seg-btn ${tab === 'progress' ? 'on' : ''}" onclick="setExamAnaTab('progress')">进步榜</button>
      </div>
    </div>
    ${body}
  </div>`;
}
function setExamAnaTab(t){ ui.examAnaTab = t; refreshExamAna(); }
function setExamAnaPeriod(p){ ui.examAnaPeriod = p; refreshExamAna(); }
function setExamAnaBy(b){ ui.examAnaBy = b; refreshExamAna(); }
function refreshExamAna(){
  const el = document.getElementById('examAnaRoot');
  if (el) el.outerHTML = examAnaHtml(activeClass());
}

function setExam(sid, period, field, val){
  const cls = activeClass();
  cls.examScores[sid] = cls.examScores[sid] || {};

function setZhongkao(sid, sub, val){
  const cls = activeClass();
  cls.examScores[sid] = cls.examScores[sid] || {};
  cls.examScores[sid].zhongkao = cls.examScores[sid].zhongkao || {};

  save();

/* ==================================================================
   Tab 6 / 7：等级线记录 + 试卷记录（IndexedDB 文件）
   ================================================================== */
function fileIcon(name, type){
  const ext = (name || '').split('.').pop().toLowerCase();
  if ((type || '').startsWith('image/')) return '🖼️';
  if (ext === 'pdf') return '📕';
  if (['doc','docx'].includes(ext)) return '📘';
  if (['xls','xlsx','csv'].includes(ext)) return '📗';
  if (['ppt','pptx'].includes(ext)) return '📙';

function applyBatchWeekly(){
  const date = (document.getElementById('bwDate').value || state.activeDate);
  const text = (document.getElementById('bwText').value || '');
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return toast('请先粘贴要添加的内容');
  const parsed = lines.map(line => {
    const parts = line.split('-').map(p => p.trim());
    if (parts.length < 2) return { ok:false, line, msg:'至少需 姓名-成绩' };
    let name, type, content, score;
    if (parts.length === 2) { [name, score] = parts; type = '周测'; content = ''; }
    else if (parts.length === 3) { [name, type, score] = parts; content = ''; }
    else { [name, type, content, score] = parts; }
    const stu = findStudentByName(name);
    return {
      ok: num(score) != null, line,
      rec: {
        id:'w' + uid(), studentId: stu ? stu.id : '', name: stu ? stu.name : name,
        className: stu ? stu.className : '', school: stu ? stu.school : '',
        date, type: (type === '月考' ? '月考' : '周测'), content: content || '', score, lost: ''
      },
      msg: num(score) == null ? '成绩不是数字' : (stu ? '' : '⚠ 未匹配到班级学生')
    };
  });
  const okCount = parsed.filter(p => p.ok).length;
  _batchDate = date;
  _batchRecs = parsed.filter(p => p.ok).map(p => p.rec);
  const body = `<div class="batch-preview">
    <div class="muted" style="margin-bottom:8px">解析出 <b>${okCount}</b> 条有效记录（其余将被跳过）：</div>
    <div class="tbl-wrap" style="max-height:300px"><table>
      <thead><tr><th>状态</th><th>姓名</th><th>类型</th><th>内容</th><th>成绩</th></tr></thead>
      <tbody>${parsed.map(p => `<tr>

function commitSchoolGrade(){
  const school = document.getElementById('sgSchool').value;
  const date = document.getElementById('sgDate').value;
  const type = document.getElementById('sgType').value;

  const rows = [...document.querySelectorAll('#sgWrap .sg-row')];

/* -------- 周测月考趋势分析（纯 SVG 折线图，离线可用）-------- */
const TREND_COLORS = ['#2563eb','#f59e0b','#22c55e','#ef4444','#a855f7','#06b6d4','#ec4899','#64748b'];
function schoolOfWeeklyStudent(studentId){
  const t = state.weeklyExams.students.find(x => String(x.id) === String(studentId));
  return t ? (t.school || '未填学校') : '未填学校';
}
function svgLineChart(series, opts){
  opts = opts || {};
  const W = opts.width || 820, H = opts.height || 320, padL = 46, padR = 16, padT = 16, padB = 48;
  const iw = W - padL - padR, ih = H - padT - padB;
  const xl = opts.xLabels || [];
  const xCount = xl.length;
  let maxY = opts.maxY || 0;
  series.forEach(s => (s.points || []).forEach(p => {
    if (p && p.val != null && !isNaN(p.val)) maxY = Math.max(maxY, p.val);
  }));
  if (maxY <= 0) maxY = 100;
  maxY = Math.ceil(maxY / 10) * 10;
  const xAt = i => xCount <= 1 ? padL + iw / 2 : padL + iw * i / (xCount - 1);
  const yAt = v => padT + ih - (Math.max(0, Math.min(maxY, v)) / maxY) * ih;
  let g = '';
  for (let i = 0; i <= 5; i++) {
    const v = maxY * i / 5, y = yAt(v);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e2ecf9" stroke-width="1"/>`;
    g += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#8a94a6">${Math.round(v)}</text>`;
  }
  xl.forEach((lb, i) => { const x = xAt(i); g += `<text x="${x}" y="${H - padB + 18}" text-anchor="middle" font-size="10.5" fill="#8a94a6">${esc(lb)}</text>`; });
  g += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + ih}" stroke="#c3d8f2" stroke-width="1.5"/>`;
  g += `<line x1="${padL}" y1="${padT + ih}" x2="${W - padR}" y2="${padT + ih}" stroke="#c3d8f2" stroke-width="1.5"/>`;
  series.forEach(s => {
    const col = s.color || '#2563eb';
    const w = s.width || 2.5;
    const dash = s.dashed ? ' stroke-dasharray="5 4"' : '';
    const r = (s.bold ? 3.4 : 2.4);
    let path = '', started = false;
    (s.points || []).forEach((p, i) => {
      if (p == null || p.val == null || isNaN(p.val)) { started = false; return; }
      const x = xAt(i), y = yAt(p.val);
      if (!started) { path += `M${x},${y}`; started = true; } else path += `L${x},${y}`;
    });
    if (path) g += `<path d="${path}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${dash}/>`;
    (s.points || []).forEach((p, i) => {
      if (p == null || p.val == null || isNaN(p.val)) return;
      const x = xAt(i), y = yAt(p.val);
      g += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${col}" stroke-width="2"/>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block;margin:0 auto">${g}</svg>`;
}
function weeklyTrendData(){
  const type = ui.trendType || 'all';
  const match = r => (type === 'all' || r.type === type) && num(r.score) != null;
  if (ui.trendMode === 'school') {
    const recs = state.weeklyExams.records.filter(match);
    const schools = [...new Set(recs.map(r => schoolOfWeeklyStudent(r.studentId)))];
    const dates = [...new Set(recs.map(r => r.date))].filter(Boolean).sort();
    // 各校平均分序列（用于校际对比总览）
    const series = schools.map((sc, si) => ({
      name: sc, color: TREND_COLORS[si % TREND_COLORS.length],
      points: dates.map(d => {
        const vs = recs.filter(r => schoolOfWeeklyStudent(r.studentId) === sc && r.date === d).map(r => num(r.score));
        const avg = vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10 : null;
        return { label: mdShort(d), val: avg };
      }),
    }));
    const ranking = schools.map(sc => {
      const vs = recs.filter(r => schoolOfWeeklyStudent(r.studentId) === sc).map(r => num(r.score));
      return { name: sc, avg: vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10 : null, n: vs.length };
    }).filter(x => x.avg != null).sort((a, b) => b.avg - a.avg);
    // 选定学校 → 该校全体学生成绩分析（逐个学生折线 + 统计表）
    const selSchool = (ui.trendSchool && schools.includes(ui.trendSchool)) ? ui.trendSchool : (schools[0] || '');
    let drillSeries = [], schoolStudents = [];
    if (selSchool) {
      const stuList = studentsBySchool(selSchool);
      schoolStudents = stuList.map(st => {
        const srecs = recs.filter(r => String(r.studentId) === String(st.id)).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        const vs = srecs.map(r => num(r.score));
        const avg = vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10 : null;
        const max = vs.length ? Math.max(...vs) : null;
        const min = vs.length ? Math.min(...vs) : null;
        const trend = vs.length >= 2 ? vs[vs.length - 1] - vs[0] : 0;
        const arrow = trend > 0 ? '📈 上升' : trend < 0 ? '📉 下降' : '➖ 持平';
        const latest = srecs.length ? srecs[srecs.length - 1].score : '—';
        return { id: st.id, name: st.name, className: st.className, avg, max, min, arrow, latest, count: vs.length,
          points: dates.map(d => { const rr = srecs.find(r => r.date === d); return { label: mdShort(d), val: rr ? num(rr.score) : null }; }) };
      }).sort((a, b) => ((b.avg == null ? -1 : b.avg) - (a.avg == null ? -1 : a.avg)));
      const stuSeries = schoolStudents.filter(s => s.count > 0).map((s, i) => ({
        name: s.name, color: TREND_COLORS[(i + 1) % TREND_COLORS.length], width: 1.6, dashed: true, points: s.points,
      }));
      const avgSeries = {
        name: selSchool + '·平均', color: '#1d4ed8', width: 3.4, bold: true,
        points: dates.map(d => {
          const vs = recs.filter(r => schoolOfWeeklyStudent(r.studentId) === selSchool && r.date === d).map(r => num(r.score));
          const avg = vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10 : null;
          return { label: mdShort(d), val: avg };
        }),
      };
      drillSeries = [avgSeries, ...stuSeries];
    }
    return { mode: 'school', xLabels: dates.map(mdShort), series, ranking, schools, selSchool, drillSeries, schoolStudents };
  }
  const sid = ui.trendStudentId || (state.weeklyExams.students[0] && state.weeklyExams.students[0].id);
  const recs = state.weeklyExams.records.filter(r => String(r.studentId) === String(sid) && match(r))
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const dates = recs.map(r => r.date);
  const series = [{
    name: '成绩', color: TREND_COLORS[0],
    points: recs.map(r => ({ label: mdShort(r.date), val: num(r.score) })),
  }];
  const vs = recs.map(r => num(r.score));
  const avg = vs.length ? Math.round(vs.reduce((a, b) => a + b, 0) / vs.length * 10) / 10 : null;
  const max = vs.length ? Math.max(...vs) : null, min = vs.length ? Math.min(...vs) : null;
  const trend = (vs.length >= 2) ? (vs[vs.length - 1] - vs[0]) : 0;
  const arrow = trend > 0 ? '📈 上升' : trend < 0 ? '📉 下降' : '➖ 持平';
  return { mode: 'student', xLabels: dates.map(mdShort), series, sid, stats: { avg, max, min, arrow } };
}

const LD_COST = 5;

/* 权重归一化为 0~100 的扇区区间：权重总和无论改成多少，转盘都按真实比例绘制 */
function segRanges(){
  const segs = LSEG();
  const sum = segs.reduce((a, b) => a + Math.max(0, b.weight || 0), 0);
  if (!sum) return segs.map((s, i) => ({ seg:s, start:i * 100 / segs.length, end:(i + 1) * 100 / segs.length }));
  let acc = 0;
  return segs.map(s => {
    const st = acc; acc += Math.max(0, s.weight || 0) / sum * 100;
    return { seg:s, start:st, end:acc };
  });
}
function wheelGradient(){
  return `conic-gradient(${segRanges().map(r => `${r.seg.color} ${r.start.toFixed(3)}% ${r.end.toFixed(3)}%`).join(',')})`;
}
function wheelLabels(){
  return segRanges().map(r => {
    const span = r.end - r.start;
    const mid = (r.start + r.end) / 2 * 3.6;
    const rad = span >= 14 ? 92 : 104;
    const showTxt = span >= 9;
    return `<div class="wheel-label"
      style="transform:rotate(${mid}deg) translateY(-${rad}px) rotate(${-mid}deg) translate(-50%,-50%)">
      <span class="wl-ico" style="font-size:${span >= 14 ? 23 : span >= 8 ? 19 : 15}px">${r.seg.icon}</span>
      ${showTxt ? `<span class="wl-txt">${esc(r.seg.label)}</span>` : ''}
    </div>`;
  }).join('');
}
/* 转盘外圈跑马灯小灯珠 */
function wheelPins(n){
  let h = '';
  for (let i = 0; i < n; i++) {
    const a = i * 360 / n;
    h += `<i class="wheel-pin" style="transform:rotate(${a}deg) translateY(-155px)"></i>`;
  }
  return h;
}

function pickWeighted(){
  const total = LSEG().reduce((a, b) => a + b.weight, 0);
  let r = Math.random() * total;
  for (const s of LSEG()) { r -= s.weight; if (r <= 0) return s; }
  return LSEG()[0];
}
function milkTeaFlavor(stu){
  const r = recRaw(stu, state.activeDate);
  const hasPositive = r && (r.behavior || []).some(k => {
    const o = optOf(BOPTS(), k); return o && o.type === 'positive';
  });
  if (hasPositive) return '喜茶';
  return ui.ldMood === 'good' ? '芋圆葡萄' : '柠檬水';
}
function spinWheel(){
  const f = ldStudent();
  if (!f) return toast('请先选择学生');
  if (availablePoints(f.s) < LCOST()) return toast('积分不足');
  if (ui.ldSpinning) return;

  const seg = pickWeighted();
  const ranges = segRanges();
  const rg = ranges.find(x => x.seg.key === seg.key);
  const midPct = (rg.start + rg.end) / 2;
  const spanDeg = (rg.end - rg.start) * 3.6;
  const jitter = (Math.random() - 0.5) * spanDeg * 0.55;
  const mid = midPct * 3.6 + jitter;
  const cur = ((ui.ldRotation % 360) + 360) % 360;
  const want = ((360 - mid) % 360 + 360) % 360;
  let delta = want - cur;
  if (delta < 0) delta += 360;
  ui.ldRotation += 360 * 6 + delta;

  ui.ldSpinning = true;
  const wheel = document.getElementById('ldWheel');
  const btn = document.getElementById('ldBtn');
  const panel = document.querySelector('.ld-panel');
  if (panel) panel.classList.add('ld-spinning');
  if (btn) { btn.disabled = true; btn.textContent = '🌀 转动中…'; }
  if (wheel) wheel.style.transform = `rotate(${ui.ldRotation}deg)`;
  startPointerKnock();

  setTimeout(() => {
    stopPointerKnock();
    ui.ldSpinning = false;
    const now = new Date();
    const time = now.toTimeString().slice(0, 8);
    const stu = f.s;
    stu.spentPoints = (stu.spentPoints || 0) + LCOST();
    stu.ptsLog = stu.ptsLog || [];
    stu.ptsLog.push({ date: todayStr(), time, amount: -LCOST(), reason: `抽奖消耗（${seg.label}）`, source: 'luckydraw' });

    let extra = '';
    if (seg.key === 'milktea') extra = milkTeaFlavor(stu);

    const entry = { id: 'h' + uid(), studentName: stu.name, className: f.c.name,
      key: seg.key, label: seg.label, icon: seg.icon, date: todayStr(), time, extra };
    state.ldHistory.unshift(entry);
    if (state.ldHistory.length > 50) state.ldHistory = state.ldHistory.slice(0, 50);
    save();

    let html = `<div class="rr-ico">${seg.icon}</div><div class="rr-t">${esc(seg.label)}</div>`;
    if (seg.key === 'milktea') {
      html += `<div class="rr-d">🧋 推荐饮品：<b>${esc(extra)}</b></div>`;
    } else if (seg.key === 'universal') {
      html += `<div class="rr-d">${esc(seg.desc || '')}</div>
        <div class="uni-opts">${uniKeys().map(o =>
          `<button class="btn" onclick="chooseUniversal('${entry.id}','${o.key}')">${o.icon} ${esc(o.label)}</button>`
        ).join('')}</div>`;
    } else {
      html += `<div class="rr-d">${esc(seg.desc || '')}</div>`;
    }
    ldRender(html);
    showWinCard(seg, stu.name, f.c.name, extra, entry.id);
    toast(`🎉 ${stu.name} 抽中了「${seg.label}」${extra ? '·' + extra : ''}`);
  }, 5300);
}
/* 万能券可选子项：优先取现有奖项中的四张券，缺失则回退出厂配置，避免用户删项后崩溃 */
function uniKeys(){
  const want = ['noPunish','noHomework','leavePass','praise'];
  return want.map(k => optOf(LSEG(), k) || LD_SEGMENTS.find(s => s.key === k)).filter(Boolean);
}
/* ---- 指针撞针音效感（视觉抖动） ---- */
let _knockTimer = null;
function startPointerKnock(){
  const p = document.getElementById('ldPointer');
  if (!p) return;
  let i = 0;
  const tick = () => {
    p.classList.remove('knock'); void p.offsetWidth; p.classList.add('knock');
    i++;
    const gap = i < 14 ? 82 : i < 24 ? 82 + (i - 14) * 26 : 340 + (i - 24) * 62;
    _knockTimer = setTimeout(tick, gap);
  };
  tick();
}
function stopPointerKnock(){
  if (_knockTimer) { clearTimeout(_knockTimer); _knockTimer = null; }
  const p = document.getElementById('ldPointer');
  if (p) p.classList.remove('knock');
}
/* ---- 中奖庆祝：彩带 + 大弹层 ---- */
function fireConfetti(n){
  const root = document.getElementById('confettiRoot');
  if (!root) return 0;
  const count = n || 90;
  const colors = ['#fbbf24','#f59e0b','#2563eb','#60a5fa','#38bdf8','#ef4444','#22c55e','#ffffff','#a855f7'];
  let h = '';
  for (let i = 0; i < count; i++) {
    const left = Math.random() * 100;
    const dur = 2.2 + Math.random() * 2.2;
    const delay = Math.random() * .9;
    const c = colors[(Math.random() * colors.length) | 0];
    const w = 6 + Math.random() * 7, hh = 9 + Math.random() * 11;
    const round = Math.random() > .72 ? '50%' : '2px';
    h += `<i class="cfti" style="left:${left}%;width:${w}px;height:${hh}px;background:${c};
      border-radius:${round};animation-duration:${dur}s;animation-delay:${delay}s"></i>`;
  }
  root.innerHTML = h;
  setTimeout(() => { if (root) root.innerHTML = ''; }, 5200);
  return count;
}

function ldsRefreshLive(){
  const segs = LSEG();
  const sum = segs.reduce((a, b) => a + Math.max(0, b.weight || 0), 0) || 1;
  segs.forEach(s => {
    const pct = Math.max(0, s.weight || 0) / sum * 100;
    const t = document.querySelector(`[data-pct="${s.key}"]`);
    const b = document.querySelector(`[data-bar="${s.key}"]`);
    if (t) t.textContent = pct.toFixed(1) + '%';
    if (b) b.style.width = pct.toFixed(1) + '%';
  });
  const mini = document.getElementById('ldsMini');
  if (mini) mini.style.background = wheelGradient();
}
function ldCostSet(v){
  if (!state.lottery) state.lottery = { cost: LD_COST, segments: LD_SEGMENTS.map(o => ({ ...o })) };
  state.lottery.cost = Math.max(0, v || 0); save();
}
function ldSegSet(key, field, val){
  const o = optOf(LSEG(), key);

function ldSegMove(key, dir){
  const arr = state.lottery.segments, i = arr.findIndex(s => s.key === key), j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]]; save(); renderLdSettings();
}
function ldSegDel(key){

function pePreviewHtml(key, P){
  if (key === 'roster') {
    const r = P.roster;
    const calc = (att, q, h) => {
      let p = att === 'present' ? r.att.present : att === 'late' ? r.att.late : r.att.leave;
      if (q === r.quizFull) p += r.quizFullBonus;
      else if (q >= r.quizHigh) p += r.quizHighBonus;
      if (h === r.hwFull) p += r.hwFullBonus;
      if (q === r.quizFull && h === r.hwFull) p += r.bothBonus;
      return Math.max(0, Math.min(p, r.cap));
    };
    return `<b>当日积分 =</b> 出勤/迟到基础分 + 小测满分/高分 + 作业满分 + 双满分加成（单日上限 ${r.cap}）<br>`
      + `🧮 试算：出勤+双满分 = <b>${calc('present', r.quizFull, r.hwFull)}</b> ｜ 出勤+小测满分 = <b>${calc('present', r.quizFull, 0)}</b> ｜ 仅迟到 = <b>${calc('late', 0, 0)}</b> ｜ 请假 = <b>${calc('leave', 0, 0)}</b>`;
  }
  if (key === 'checkin') {
    const c = P.checkin;
    return `<b>打卡积分 =</b> 完成打卡 ${c.done} / 补卡 ${c.makeup} ＋ 掌握度（掌握 ${c.mastery.full} / 部分 ${c.mastery.partial} / 未掌握 ${c.mastery.none}）<br>`
      + `🧮 试算：完成+掌握 = <b>${(+c.done + +c.mastery.full).toFixed(1)}</b> ｜ 补卡+部分 = <b>${(+c.makeup + +c.mastery.partial).toFixed(1)}</b> ｜ 未完成+未掌握 = <b>${(0 + +c.mastery.none).toFixed(1)}</b>`;
  }
  if (key === 'exam') {
    const e = P.exam;
    const cap = m => Math.min(m, e.cap);
    return `<b>考试成绩积分 =</b> 数学满分 ${e.mathFullBonus} ＋ 数学高分 ${e.mathHighBonus} ＋ 总分高分 ${e.totalHighBonus} ＋ 进步 ${e.improveBonus}（单期上限 ${e.cap}）<br>`
      + `🧮 试算：数学满分 = <b>${cap(e.mathFullBonus)}</b> ｜ 数学高分 = <b>${cap(e.mathHighBonus)}</b> ｜ 总分高分 = <b>${cap(e.totalHighBonus)}</b> ｜ 进步 = <b>${cap(e.improveBonus)}</b>`;
  }
  const w = P.weekly;
  const cap = m => Math.min(m, w.cap);
  return `<b>周测月考积分 =</b> 满分 ${w.fullBonus} ＋ 高分 ${w.highBonus}（单次上限 ${w.cap}）<br>`
    + `🧮 试算：满分 = <b>${cap(w.fullBonus)}</b> ｜ 高分 = <b>${cap(w.highBonus)}</b> ｜ 普通 = <b>0</b>`;
}

function applyPointsRules(){

function downloadText(filename, text, mime){
  const blob = new Blob(['\ufeff' + text], { type: (mime || 'text/csv') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/* 班级名由用户自由输入，导出前清洗掉文件名/工作表名的非法字符 */
function safeName(s){
  return (String(s == null ? '' : s).replace(/[\\/:*?"<>|\[\]]/g, '_').trim() || '未命名班级').slice(0, 24);
}
function uniqueSheetName(wb, base){
  let n = base.slice(0, 31), i = 2;
  while ((wb.SheetNames || []).includes(n)) n = (base.slice(0, 28) + '_' + i++).slice(0, 31);
  return n;
}
function csvCell(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows){ return rows.map(r => r.map(csvCell).join(',')).join('\n'); }
function labelsOf(list, keys){
  return (keys || []).map(k => { const o = optOf(list, k); return o ? o.label : k; }).join('；');
}
function attLabel(k){ const o = optOf(ATTENDANCE_OPTS, k); return o ? o.label : k; }

      Object.keys(c.checkins[d] || {}).forEach(sid => {

  /* 错题库：功能已下线，仅当历史数据存在时随备份一并导出，避免旧数据丢失 */
  const mk = [['班级','姓名','日期','类型','题目','错因','状态']];
  state.classes.forEach(c => c.students.forEach(s => (s.mistakes || []).forEach(m =>
    mk.push([c.name, s.name, m.date, m.type || '', m.question, m.reason || '', m.mastered ? '已掌握' : '待巩固']))));
  if (mk.length > 1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mk), '错题库(历史)');

  const ls = [['班级','日期','上课内容','主题']];
  state.classes.forEach(c => Object.keys(c.lessons || {}).sort().forEach(d => {
    const l = c.lessons[d];
    ls.push([c.name, d, l.content || '', l.topic ? (optOf(TOPIC_OPTS, l.topic) || {}).label : '']);
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ls), '上课内容');

  const flds = PROFILE_FIELDS;
  const customLabels = [];
  Object.values(state.studentProfiles || {}).forEach(p => (p.custom || []).forEach(x => {
    if (x && x.label && !customLabels.includes(x.label)) customLabels.push(x.label);
  }));
  const pf = [['姓名', ...flds.map(c => c.l), ...customLabels]];
  Object.values(state.studentProfiles || {}).forEach(p => {
    const row = [p.name || '', ...flds.map(x => p[x.k] || '')];
    if (customLabels.length) row.push(...customLabels.map(l => {
      const f = (p.custom || []).find(x => x.label === l); return f ? (f.value || '') : '';
    }));
    pf.push(row);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pf), '学生档案');

  const exHead = ['班级','姓名'];
  EXAM_PERIODS.forEach(p => exHead.push(`${p}-数学`, `${p}-数学等级`, `${p}-总分`, `${p}-总分等级`));
  ZHONGKAO_SUBJECTS.forEach(s => exHead.push(`中考-${s}`));
  exHead.push('中考-总分', '中考-录取学校');
  const ex = [exHead];
  state.classes.forEach(c => examStudentList(c).forEach(s => {
    const es = c.examScores[s.id] || {}, zk = es.zhongkao || {};
    const row = [c.name, s.name + (s.inClass ? '' : '（档）')];
    EXAM_PERIODS.forEach(p => { const d = es[p] || {}; row.push(d.mathScore || '', d.mathGrade || '', d.totalScore || '', d.totalGrade || ''); });
    ZHONGKAO_SUBJECTS.forEach(sub => row.push(zk[sub] || ''));
    row.push(zk['总分'] || '', zk['录取学校'] || '');
    ex.push(row);
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ex), '考试成绩');

  const we = [['姓名','班级','考试时间','考试类型','考试内容','分数','丢分点']];
  state.weeklyExams.records.forEach(r => we.push([r.name, r.className, r.date, r.type, r.content || '', r.score || '', r.lost || '']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(we), '周测月考');

  const td = [['待办内容','状态','创建日期']];
  state.todos.forEach(t => td.push([t.text, t.done ? '已完成' : '未完成', t.created || '']));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(td), '待办事项');

  const ld = [['学生','班级','奖项','附加','日期','时间']];
  state.ldHistory.forEach(h => ld.push([h.studentName, h.className, h.label, h.extra || '', h.date, h.time]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ld), '抽奖记录');

  const json = JSON.stringify(state);
  const CH = 30000, raw = [];
  for (let i = 0; i < json.length; i += CH) raw.push([json.slice(i, i + CH)]);
  if (!raw.length) raw.push(['{}']);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(raw), '__RAW__');

  XLSX.writeFile(wb, `课堂记录工作台_备份_${todayStr()}.xlsx`);
  toast('备份完成 📦');
}

/* -------- GitHub 云同步 -------- */
const GH_CFG_KEY = 'wb_gh_cfg';
function ghCfg(){
  let c = {};
  try { c = JSON.parse(localStorage.getItem(GH_CFG_KEY) || '{}') || {}; } catch(e){ c = {}; }
  return {
    user: c.user || '',
    repo: c.repo || 'cai-math-class',
    path: c.path || 'data/state.json',
    token: c.token || '',
    autoSave: !!c.autoSave,
    autoSaveMin: (typeof c.autoSaveMin === 'number' && c.autoSaveMin > 0) ? c.autoSaveMin : 5
  };
}
function ghPersist(){
  const c = ghCfg();
  c.user = (document.getElementById('ghUser').value || '').trim();
  c.repo = (document.getElementById('ghRepo').value || '').trim() || 'cai-math-class';
  c.path = (document.getElementById('ghPath').value || '').trim() || 'data/state.json';
  const tk = document.getElementById('ghToken').value || '';
  if (tk) c.token = tk;   // 仅在填写了新令牌时覆盖，避免误清空已有令牌
  const asEl = document.getElementById('ghAutoSave');
  c.autoSave = !!(asEl && asEl.checked);
  const amEl = document.getElementById('ghAutoSaveMin');
  const am = parseInt((amEl && amEl.value) || '5', 10);
  c.autoSaveMin = (am > 0) ? am : 5;
  localStorage.setItem(GH_CFG_KEY, JSON.stringify(c));
}
function ghB64encode(str){
  const s = unescape(encodeURIComponent(str));
  if (typeof btoa === 'function') return btoa(s);
  if (typeof Buffer !== 'undefined') return Buffer.from(s, 'binary').toString('base64');
  throw new Error('当前环境不支持 base64 编码');
}
function ghB64decode(b64){
  let s;
  if (typeof atob === 'function') s = atob(b64);
  else if (typeof Buffer !== 'undefined') s = Buffer.from(b64, 'base64').toString('binary');
  else throw new Error('当前环境不支持 base64 解码');
  return decodeURIComponent(escape(s));
}
function ghSetStatus(msg){ const el = document.getElementById('ghStatus'); if (el) el.innerHTML = msg; }
function ghApiHeaders(){
  const c = ghCfg();
  const h = { 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  if (c.token) h['Authorization'] = 'token ' + c.token;
  return h;
}
function ghContentUrl(){
  const c = ghCfg();
  return 'https://api.github.com/repos/' + encodeURIComponent(c.user) + '/' + encodeURIComponent(c.repo) +
         '/contents/' + c.path.split('/').map(encodeURIComponent).join('/');
}
async function ghSave(silent){
  const c = ghCfg();
  if (!c.user || !c.repo) { if (!silent) ghSetStatus('⚠️ 请先填写 GitHub 用户名和仓库名'); return; }
  if (!c.token) { if (!silent) ghSetStatus('⚠️ 请填写个人访问令牌 PAT'); return; }
  if (!silent) ghSetStatus('☁️ 正在保存到 GitHub…');
  try {
    const content = ghB64encode(JSON.stringify(state));
    let sha;
    try {
      const r = await fetch(ghContentUrl(), { headers: ghApiHeaders() });
      if (r.ok) { const j = await r.json(); sha = j.sha; }
      else if (r.status !== 404) { const e = await r.json().catch(()=>({})); throw new Error(e.message || ('HTTP ' + r.status)); }
    } catch(e){ if (e.message && e.message.indexOf('HTTP') === 0) throw e; }
    const body = { message: '班级工作台数据备份 ' + new Date().toISOString(), content: content };
    if (sha) body.sha = sha;
    const r2 = await fetch(ghContentUrl(), {
      method: 'PUT',
      headers: ghApiHeaders(),
      body: JSON.stringify(body)
    });
    if (!r2.ok) { const e = await r2.json().catch(()=>({})); throw new Error(e.message || ('HTTP ' + r2.status)); }
    ghSetStatus('✅ ' + (silent ? '自动' : '') + '已保存到 GitHub（' + c.user + '/' + c.repo + (silent ? ' · ' + new Date().toLocaleTimeString() : '') + '）');
    if (!silent) toast('已保存到云端 ☁️');
  } catch(e){
    const msg = '保存失败：' + e.message + '（检查用户名 / 仓库 / PAT 是否正确，PAT 需有 repo 权限）';
    ghSetStatus((silent ? '⚠️ 自动' : '❌') + msg);
  }
}
let _ghAutoTimer = null;
function ghStartAutoSave(){
  if (_ghAutoTimer) { clearInterval(_ghAutoTimer); _ghAutoTimer = null; }
  const c = ghCfg();
  if (!c.autoSave || !c.user || !c.repo || !c.token) return;
  const ms = Math.max(1, c.autoSaveMin) * 60 * 1000;
  _ghAutoTimer = setInterval(() => {
    const cc = ghCfg();
    if (cc.autoSave && cc.user && cc.repo && cc.token) ghSave(true);
  }, ms);
  ghSetStatus('🔄 已开启自动保存（每 ' + c.autoSaveMin + ' 分钟），也可随时点「保存到云端」手动备份');
}
async function ghRestore(){
  const c = ghCfg();
  if (!c.user || !c.repo) return ghSetStatus('⚠️ 请先填写 GitHub 用户名和仓库名');
  if (!c.token) return ghSetStatus('⚠️ 请填写个人访问令牌 PAT');
  ghSetStatus('📥 正在从 GitHub 恢复…');
  try {
    const r = await fetch(ghContentUrl(), { headers: ghApiHeaders() });
    if (r.status === 404) return ghSetStatus('ℹ️ 云端暂无备份文件（请先「保存到云端」）');
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || ('HTTP ' + r.status)); }
    const j = await r.json();
    const data = JSON.parse(ghB64decode(j.content));
    if (!data || !Array.isArray(data.classes)) throw new Error('文件不是有效的工作台备份');
    state = data;
    normalizeState(); syncWeeklyExamStudents(); saveNow(true);
    renderSidebar(); renderMain();
    ghSetStatus('✅ 已从云端恢复（' + c.user + '/' + c.repo + '）');
    toast('已从云端恢复 ✅');
  } catch(e){
    ghSetStatus('❌ 恢复失败：' + e.message);
  }
}
async function ghTest(){
  const c = ghCfg();
  if (!c.user || !c.token) return ghSetStatus('⚠️ 请先填写用户名和 PAT');
  ghSetStatus('🔌 正在测试连接…');
  try {
    const r = await fetch('https://api.github.com/user', { headers: ghApiHeaders() });
    if (r.status === 401) return ghSetStatus('❌ 令牌无效或无权限（确认 PAT 正确且有 repo 权限）');
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || ('HTTP ' + r.status)); }
    const u = await r.json();
    ghSetStatus('✅ 连接成功，登录用户：' + u.login);
  } catch(e){
    ghSetStatus('❌ 连接失败：' + e.message);
  }
}
function ghClearToken(){
  const c = ghCfg();
  c.token = '';
  localStorage.setItem(GH_CFG_KEY, JSON.stringify(c));
  const el = document.getElementById('ghToken'); if (el) el.value = '';
  ghSetStatus('🗑️ 已清除本地保存的令牌');
}

/* -------- 一键导入旧数据（跨域 iframe + postMessage） -------- */
let _importToken = null;
function ghImportStatus(msg){ const el = document.getElementById('importStatus'); if (el) el.innerHTML = msg; }
function ghImportOld(){
  const src = (document.getElementById('importSrc') && document.getElementById('importSrc').value || '').trim();
  if (!src) return ghImportStatus('⚠️ 请填写旧链接地址');
  let origin;
  try { origin = new URL(src).origin; } catch (e) { return ghImportStatus('⚠️ 链接格式不正确'); }
  ghImportStatus('📦 正在从旧链接读取数据…（若浏览器拦截嵌入，请改用下方备用方案）');
  const token = Math.random().toString(36).slice(2) + Date.now().toString(36);
  _importToken = token;
  const sep = src.indexOf('?') >= 0 ? '&' : '?';
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = src + sep + 'wb_import=1';
  let done = false;
  const cleanup = () => { try { iframe.remove(); } catch (e) {} window.removeEventListener('message', onMsg); clearTimeout(timer); };
  const onMsg = (ev) => {
    if (ev.origin !== origin) return;
    const d = ev.data;
    if (!d || d.type !== 'WB_IMPORT_RES' || d.token !== token) return;
    done = true; cleanup();
    if (d.data && typeof d.data === 'string') {
      try {
        const parsed = JSON.parse(d.data);
        if (!parsed || !Array.isArray(parsed.classes)) throw new Error('旧数据格式不正确');
        if (!confirm('即将用旧链接的数据覆盖当前数据，确定继续？\n（建议先点「保存到云端」备份当前数据）')) return;
        localStorage.setItem(STORAGE_KEY, d.data);
        if (d.ghcfg) { try { JSON.parse(d.ghcfg); localStorage.setItem('wb_gh_cfg', d.ghcfg); } catch (e) {} }
        state = parsed; normalizeState(); syncWeeklyExamStudents(); saveNow(true);
        renderSidebar(); renderMain();
        if (d.ghcfg) ghStartAutoSave();
        ghImportStatus('✅ 已从旧链接导入数据（含云同步配置），页面已刷新');
        toast('已导入旧数据 ✅');
      } catch (e) { ghImportStatus('❌ 导入失败：' + e.message); }
    } else {
      ghImportStatus('ℹ️ 旧链接中未找到数据（可能该浏览器此前未录入过）');
    }
  };
  window.addEventListener('message', onMsg);
  const timer = setTimeout(() => {
    if (done) return; cleanup();
    ghImportStatus('⚠️ 无法自动读取旧链接（该站点可能禁止被嵌入或被浏览器拦截）。请改用备用方案：① 在旧链接点「☁️ 保存到云端」，再在本页点「📥 从云端恢复」；② 或用之前给的书签法（旧链接点①取数据 → 本页点②写入）。');
  }, 9000);
  iframe.onerror = () => { if (!done) { cleanup(); ghImportStatus('⚠️ 旧链接无法加载，请确认地址正确且可访问。'); } };
  iframe.onload = () => { try { iframe.contentWindow.postMessage({ type: 'WB_IMPORT_REQ', token: token }, origin); } catch (e) {} };
  document.body.appendChild(iframe);
}

async function exportLongImage(){

  closeMulti();
  const app = document.getElementById('app');

    ...app.querySelectorAll('.main, .content, .tbl-wrap, .side-list, .sidebar, .chart-box')];

      windowWidth: app.scrollWidth, windowHeight: app.scrollHeight,
      width: app.scrollWidth, height: app.scrollHeight,
    });

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
    toast('长图已导出 📸');
  } catch (e) {
    console.error(e); toast('长图生成失败');

/* 被其他源（如 benji.中国 导入旧数据）以 iframe 嵌入时，响应数据导出请求。
   仅当 URL 带 ?wb_import=1 时才回传，避免被普通嵌入滥取；token 握手防止混淆代理。 */
window.addEventListener('message', (ev) => {
  try {
    const d = ev.data;
    if (!d || d.type !== 'WB_IMPORT_REQ') return;
    if (new URLSearchParams(location.search).get('wb_import') !== '1') return;
    let data = null, ghcfg = null;
    try { data = localStorage.getItem(STORAGE_KEY) || null; } catch (e) {}
    try { ghcfg = localStorage.getItem('wb_gh_cfg') || null; } catch (e) {}
    const src = ev.source;
    if (src && src.postMessage) src.postMessage({ type: 'WB_IMPORT_RES', token: d.token, data: data, ghcfg: ghcfg }, { targetOrigin: ev.origin });
  } catch (e) {}
});

  //     绝不能用 hasRealData 做判断，否则「新建了班级但还没录成绩」会被覆盖清空）
  const needEmbedded = !hasLocal;
  if (needEmbedded && EMBEDDED_DEFAULT_DATA && EMBEDDED_DEFAULT_DATA.classes && EMBEDDED_DEFAULT_DATA.classes.length > 0) {
    state = JSON.parse(JSON.stringify(EMBEDDED_DEFAULT_DATA));
    state.activeDate = todayStr();
    normalizeState();
    syncWeeklyExamStudents();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    renderSidebar();
    renderMain();
  } else {
    syncWeeklyExamStudents();
  }

  // 3. 更新保存状态
  updateSaveStatus('saved');
  setTimeout(() => updateSaveStatus('synced'), 1400);

  // 4. 若已开启云同步自动保存，则启动定时器
  ghStartAutoSave();
})();
</script>
</body>
</html>
